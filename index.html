<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Pião — Spinning Draw</title>
  <style type="text/css" media="screen">
    :root {
      /* Direção única da luz: vem de cima/esquerda; as sombras caem para baixo/direita
         nesta direção (vetor unitário na tela). Mesma luz do JS (LUZ). */
      --luz-x: 0.75;
      --luz-y: 0.66;
      --bg-1: #f1f1ef;
      --bg-2: #d1d0cb;
      --metal: #d0d7de;
      --metal-shadow: #727a84;
      --face-1: #3d3e41;
      --face-2: #303134;
      --face-text: #ffffff;
      --frame-red: #d80f24;
      --red-cta-2: rgb(160,0,0);
      --scene-1: #1a1d18;
      --piao-bg: radial-gradient(circle at 40% 36%, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.015) 30%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.5) 100%), radial-gradient(circle at 44% 40%, #141516 0%, #0b0b0c 55%, #040404 100%);
      --moldura-shadow: inset 0 0 25px 8px rgba(0, 0, 0, 0.9), inset calc(6px * var(--luz-x)) calc(6px * var(--luz-y)) 8px rgba(0, 0, 0, 0.55), inset calc(-3px * var(--luz-x)) calc(-3px * var(--luz-y)) 6px rgba(255, 255, 255, 0.28);
      --scene-bg: radial-gradient(circle at calc(var(--centro-x, 50%) + 22px * var(--luz-x) * var(--escala, 1)) calc(var(--centro-y, 50%) + 22px * var(--luz-y) * var(--escala, 1)), rgba(0, 0, 0, 0.3) calc(205px * var(--escala, 1)), rgba(0, 0, 0, 0.14) calc(250px * var(--escala, 1)), rgba(0, 0, 0, 0.04) calc(290px * var(--escala, 1)), transparent calc(330px * var(--escala, 1))), radial-gradient(circle at 28% 14%, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.05) 50%, transparent 80%), radial-gradient(circle at 50% 50%, transparent 60%, rgba(0, 0, 0, 0.22) 100%), repeating-conic-gradient(from 0deg at var(--centro-x, 50%) var(--centro-y, 50%), #e5eae1 0deg, #d6dcd2 3.2deg, #c5ccc1 6.8deg, #161914 6.8deg, #161914 7.5deg);
    }

    html {
      height: 100%;
      height: 100dvh;
      background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      position: relative;
      height: 100%;
      height: 100dvh;
      width: 100%;
      margin: 0;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      background: linear-gradient(180deg, rgba(0,0,0,0.06), rgba(0,0,0,0.18));
      color: #111;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #palco {
      --cta-reserve: calc(112px + env(safe-area-inset-bottom, 0px));
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      bottom: var(--cta-reserve);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
      pointer-events: none;
      z-index: 1;
      -webkit-transform-origin: center center;
      transform-origin: center center;
    }

    /* Sem transform-style: preserve-3d: cada face é projetada individualmente (perspectiva do
       #piao), então o navegador não precisa ordenar planos 3D — o que o Safari faz errado. */
    #wrapper {
      width: 400px;
      height: 400px;
      position: relative;
      left: auto;
      top: auto;
      margin: 0;
      flex: 0 0 auto;
      pointer-events: none;
    }

    #piao {
      position: relative;
      top: 65px;
      margin: 0 auto;
      height: 270px;
      width: 400px; /* contém as faces mais largas (3 faces = 286px) */
      z-index: 2;
      /* Perspectiva aplicada a cada face individualmente: dá profundidade ao tambor sem
         precisar de preserve-3d (as faces de frente de um prisma convexo não se sobrepõem) */
      -webkit-perspective: 900px; /* = PERSPECTIVA no JS */
      perspective: 900px;
      -webkit-perspective-origin: 50% 50%;
      perspective-origin: 50% 50%;
      /* Janela do aro: o tambor (maior que a abertura) só aparece dentro dela */
      -webkit-clip-path: circle(201px at 50% 50%);
      clip-path: circle(201px at 50% 50%);
    }

    #piao .numero {
      position: absolute;
      height: 100%;
      border: 5px solid var(--metal);
      border-radius: 8px;
      box-shadow:
        inset 0 0 0 1px var(--metal-shadow),
        inset calc(1.4px * var(--luz-x)) calc(1.4px * var(--luz-y)) 2px rgba(255, 255, 255, 0.85),
        0 0 0 1px #3c4248,
        calc(13px * var(--luz-x)) calc(13px * var(--luz-y)) 18px rgba(0, 0, 0, 0.25),
        /* oclusão ambiente nas junções entre painéis */
        inset 10px 0 12px -8px rgba(0, 0, 0, 0.55),
        inset -10px 0 12px -8px rgba(0, 0, 0, 0.55);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Helvetica Neue', 'Arial Black', Arial, sans-serif;
      font-weight: 900;
      font-size: 195px;
      line-height: 1;
      letter-spacing: -0.03em;
      white-space: nowrap;
      overflow: hidden;
      color: var(--face-text);
      text-shadow: calc(1.5px * var(--luz-x)) calc(1.5px * var(--luz-y)) 4px rgba(0, 0, 0, 0.45);
      background: linear-gradient(150deg, var(--face-1) 0%, var(--face-2) 40%, #26272a 100%);
      box-sizing: border-box;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      user-select: none;
      transition: color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    /* Sombreamento por ângulo (Lambert): escurece a face conforme ela vira para o lado */
    #piao .numero::after {
      content: "";
      position: absolute;
      inset: -5px;
      border-radius: inherit;
      background: #000;
      opacity: var(--sombra, 0);
      pointer-events: none;
    }

    /* Reflexo especular (Blinn-Phong): faixa de brilho cuja intensidade vem do JS */
    #piao .numero .reflexo {
      position: absolute;
      inset: -5px;
      border-radius: inherit;
      background: linear-gradient(100deg, rgba(255, 255, 255, 0) 15%, rgba(255, 255, 255, 0.5) 48%, rgba(255, 255, 255, 0.08) 62%, rgba(255, 255, 255, 0) 85%);
      opacity: var(--brilho, 0);
      pointer-events: none;
    }

    #piao .numero::before {
      content: "";
      position: absolute;
      inset: 8px 10px 10px 10px;
      border-radius: 6px;
      background: linear-gradient(150deg, rgba(255,255,255,0.12), rgba(255,255,255,0.02), rgba(0,0,0,0.18));
      pointer-events: none;
    }

    #moldura {
      height: 400px;
      width: 400px;
      border: 45px solid transparent;
      border-radius: 50%;
      position: absolute;
      top: -45px;
      left: -45px;
      box-sizing: content-box;
      z-index: 4;
      /* Colarinho cilíndrico curto, como nas réplicas: borda frontal plana vermelho-alaranjada
         e fosca e, por dentro, a parede do cilindro que entra em direção ao tambor (faixa
         mais escura; embaixo recebe a luz que vem de cima) — ver ::before.
         A máscara recorta a abertura. */
      background:
        linear-gradient(135deg, rgba(255, 210, 190, 0.1) 0%, rgba(0, 0, 0, 0) 45%, rgba(40, 6, 0, 0.18) 100%) border-box,
        radial-gradient(circle closest-side, rgba(0, 0, 0, 0) 81.4%, #3a0a05 81.6%, #7a1a0e 83.2%, #b02a17 85.6%, #d23a22 88.2%, #ec4429 88.7%, #f0472b 96%, #e43f25 98.8%, #c9351f 100%) border-box;
      -webkit-mask: radial-gradient(circle closest-side, transparent 81.4%, #000 81.8%) border-box;
      mask: radial-gradient(circle closest-side, transparent 81.4%, #000 81.8%) border-box;
    }

    /* Parede interna da escotilha: luz invertida em relação à face (numa cavidade, o lado da
       luz fica na sombra e o lado oposto recebe luz) */
    #moldura::before {
      content: "";
      position: absolute;
      inset: -45px;
      border-radius: 50%;
      background: linear-gradient(160deg, rgba(0, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0.2) 45%, rgba(255, 150, 110, 0.22) 100%);
      -webkit-mask: radial-gradient(circle closest-side, transparent 81.4%, #000 81.6%, #000 88.5%, transparent 88.8%);
      mask: radial-gradient(circle closest-side, transparent 81.4%, #000 81.6%, #000 88.5%, transparent 88.8%);
      pointer-events: none;
    }

    #piao-bg {
      height: 404px;
      width: 404px;
      border-radius: 50%;
      position: absolute;
      top: -2px;
      left: -2px;
      background: var(--piao-bg);
      box-shadow: inset 0 0 0 3px rgba(255,255,255,0.08), inset calc(18px * var(--luz-x)) calc(18px * var(--luz-y)) 20px rgba(0,0,0,0.45), 0 0 22px rgba(0,0,0,0.16);
      z-index: 0;
    }

    /* Sombra de contato: o tambor projeta uma sombra suave no disco de fundo, deslocada para o
       lado oposto à luz principal (que vem de cima, à esquerda). Tamanho definido no JS. */
    #piao-sombra {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 300px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.35) 55%, rgba(0, 0, 0, 0));
      transform: translate(calc(-50% + 20px * var(--luz-x)), calc(-50% + 20px * var(--luz-y)));
      z-index: 1;
      pointer-events: none;
    }

    /* Sombra do aro sobre o tambor: o aro, na frente, deixa a borda da janela no escuro e
       ilumina o centro (deslocado para o lado oposto à luz) — como nas faces laterais do programa */
    #aro-oclusao {
      position: absolute;
      top: -2px;
      left: -2px;
      width: 404px;
      height: 404px;
      border-radius: 50%;
      background: radial-gradient(circle at calc(50% + 12px * var(--luz-x)) calc(50% + 12px * var(--luz-y)), rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0.36) 58%, rgba(0, 0, 0, 0.62) 72%, rgba(0, 0, 0, 0.86) 88%, rgba(0, 0, 0, 0.94) 100%);
      box-shadow: var(--moldura-shadow); /* bisel da cavidade (antes no #moldura, agora mascarado) */
      z-index: 3;
      pointer-events: none;
    }

    /* Sombra externa da moldura fora do contexto 3D (lá ela era recortada num retângulo) */
    #moldura-sombra {
      position: fixed;
      left: var(--centro-x, 50%);
      top: var(--centro-y, 50%);
      width: calc(490px * var(--escala, 1));
      height: calc(490px * var(--escala, 1));
      transform: translate(-50%, -50%);
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
      box-shadow:
        0 0 calc(60px * var(--escala, 1)) calc(12px * var(--escala, 1)) rgba(255, 80, 60, 0.26),
        0 0 calc(16px * var(--escala, 1)) calc(2px * var(--escala, 1)) rgba(255, 80, 60, 0.3),
        calc(24px * var(--luz-x) * var(--escala, 1)) calc(24px * var(--luz-y) * var(--escala, 1)) calc(48px * var(--escala, 1)) rgba(0, 0, 0, 0.32),
        calc(6px * var(--luz-x) * var(--escala, 1)) calc(6px * var(--luz-y) * var(--escala, 1)) calc(14px * var(--escala, 1)) rgba(0, 0, 0, 0.4);
    }

    /* Área invisível sobre o pião para girá-lo com o dedo / mouse */
    #area-giro {
      position: fixed;
      left: var(--centro-x, 50%);
      top: var(--centro-y, 50%);
      width: calc(490px * var(--escala, 1));
      height: calc(490px * var(--escala, 1));
      transform: translate(-50%, -50%);
      border-radius: 50%;
      z-index: 2;
      cursor: grab;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #area-giro.arrastando {
      cursor: grabbing;
    }

    #decoracao {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
      background-color: var(--scene-1);
      background-image: var(--scene-bg);
    }

    /* ================= UI ================= */
    :root {
      --ui-gold: #ffd700;
      --vidro: rgba(0, 0, 0, 0.55);
      --vidro-borda: rgba(255, 255, 255, 0.22);
      --focus-ring: 0 0 0 3px #fff, 0 0 0 6px #1565c0;
      /* Altura da faixa de resultados: acompanha a altura da tela, com mínimo e máximo */
      --hud-h: clamp(54px, 9.5vh, 80px);
    }

    button {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    #area-giro:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring) !important;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Espaço do pião: abaixo da barra de ícones e acima da faixa de sorteados */
    #palco {
      top: calc(64px + env(safe-area-inset-top, 0px));
      --cta-reserve: calc(var(--hud-h) + 32px + env(safe-area-inset-bottom, 0px));
    }

    /* ---------- Barras de ícones ---------- */
    .barra {
      position: fixed;
      top: max(12px, env(safe-area-inset-top, 0px));
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .barra-esq {
      left: max(12px, env(safe-area-inset-left, 0px));
    }

    .barra-dir {
      right: max(12px, env(safe-area-inset-right, 0px));
    }

    .icone {
      width: 44px;
      height: 44px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: var(--vidro);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--vidro-borda);
      border-radius: 50%;
      cursor: pointer;
      font: 800 13px/1 system-ui, -apple-system, sans-serif;
      letter-spacing: 0.3px;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, opacity 0.15s ease, transform 0.1s ease;
      touch-action: manipulation;
    }

    /* Apertado (toque/clique): retorno imediato, só enquanto pressionado — igual em todos os botões */
    .icone:active:not(:disabled) {
      color: var(--ui-gold);
      border-color: var(--ui-gold);
      background: rgba(255, 215, 0, 0.2);
      transform: scale(0.92);
    }

    .icone[hidden] {
      display: none;
    }

    .icone:hover:not(:disabled) {
      background: rgba(0, 0, 0, 0.75);
    }

    /* Ligado: destaque dourado */
    .icone[aria-pressed="true"] {
      color: var(--ui-gold);
      border-color: var(--ui-gold);
    }

    /* Som: desligado fica apagado */
    #btn-som[aria-pressed="false"] {
      color: rgba(255, 255, 255, 0.5);
    }

    .icone:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .faces {
      display: flex;
      align-items: center;
      height: 44px;
      background: var(--vidro);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--vidro-borda);
      border-radius: 22px;
      color: #fff;
    }

    .faces .icone {
      width: 38px;
      height: 42px;
      background: transparent;
      border: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      font-size: 22px;
      font-weight: 600;
    }

    .faces-valor {
      min-width: 24px;
      text-align: center;
      font: 800 17px/1 system-ui, -apple-system, sans-serif;
    }

    /* Sequência rodando: ícone pulsa */
    #btn-todos.rodando {
      animation: pulsar 1s infinite alternate ease-in-out;
    }

    @keyframes pulsar {
      0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
      100% { box-shadow: 0 0 0 5px rgba(255, 215, 0, 0.35); }
    }

    /* ---------- Sorteados ---------- */
    #hud-sorteados {
      position: fixed;
      z-index: 80;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: min(94vw, 760px);
      height: var(--hud-h);
      display: flex;
      align-items: center;
      gap: calc(var(--hud-h) * 0.16);
      padding: 0 calc(var(--hud-h) * 0.14);
      box-sizing: border-box;
      background: rgba(12, 12, 12, 0.62);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 215, 0, 0.35);
      border-radius: calc(var(--hud-h) * 0.3);
      box-shadow: calc(7px * var(--luz-x)) calc(7px * var(--luz-y)) 20px rgba(0, 0, 0, 0.35);
      color: #fff;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    #hud-sorteados[hidden] {
      display: none;
    }

    #hud-sorteados.completo {
      border-color: var(--ui-gold);
      box-shadow: calc(7px * var(--luz-x)) calc(7px * var(--luz-y)) 20px rgba(0, 0, 0, 0.35), 0 0 14px rgba(255, 215, 0, 0.45);
    }

    .lista-sorteados {
      display: flex;
      flex: 0 1 auto;
      gap: 6px;
      min-width: 0;
      height: 100%;
      align-items: center;
      margin: 0;
      padding: 0;
      list-style: none;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
    }

    .lista-sorteados[hidden] {
      display: none;
    }

    .lista-sorteados::-webkit-scrollbar {
      display: none;
    }

    .badge-sorteado {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: calc(var(--hud-h) * 0.62);
      height: calc(var(--hud-h) * 0.72);
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      padding: 0 calc(var(--hud-h) * 0.16);
      border-radius: calc(var(--hud-h) * 0.16);
      border: 1px solid rgba(255, 255, 255, 0.18);
      flex-shrink: 0;
      animation: badge-surgir 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .badge-sorteado .numero-sorteado {
      font-size: calc(var(--hud-h) * 0.44);
      line-height: 1;
      font-family: 'Helvetica Neue', 'Arial Black', Arial, sans-serif;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .badge-sorteado.recente {
      border-color: var(--ui-gold);
      background: var(--red-cta-2);
    }

    .badge-sorteado.recente .numero-sorteado {
      color: var(--ui-gold);
    }

    @keyframes badge-surgir {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .hud-acoes {
      display: flex;
      gap: calc(var(--hud-h) * 0.1);
      flex-shrink: 0;
    }

    /* Copiado: ícone ✓ em amarelo por um instante */
    .icone.confirmado {
      color: var(--ui-gold);
      border-color: var(--ui-gold);
    }

    /* Botões da faixa: mesmo estilo dos ícones do topo, só que no tamanho da faixa */
    .hud-acoes .icone {
      width: calc(var(--hud-h) * 0.72);
      height: calc(var(--hud-h) * 0.72);
    }

    /* ---------- Dicas ao passar o mouse (só em dispositivos com mouse) ---------- */
    @media (hover: hover) and (pointer: fine) {
      [data-tip] {
        position: relative;
      }
      [data-tip]:hover::after {
        content: attr(data-tip);
        position: absolute;
        top: calc(100% + 8px);
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 9px;
        font: 600 12px/1.2 system-ui, -apple-system, sans-serif;
        letter-spacing: 0;
        color: #fff;
        background: #151515;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        white-space: nowrap;
        pointer-events: none;
        z-index: 200;
      }
      .barra-dir [data-tip]:hover::after {
        left: auto;
        right: 0;
        transform: none;
      }
      .barra-esq > [data-tip]:hover::after,
      .faces [data-tip]:first-child:hover::after {
        left: 0;
        transform: none;
      }
      .hud-acoes [data-tip]:hover::after {
        top: auto;
        bottom: calc(100% + 8px);
      }
    }

    /* ---------- Aviso ---------- */
    #toast {
      position: fixed;
      left: 50%;
      top: calc(68px + env(safe-area-inset-top, 0px));
      transform: translateX(-50%);
      z-index: 120;
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: min(92vw, 440px);
      padding: 10px 10px 10px 16px;
      background: #222;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      border-radius: 12px;
      box-shadow: calc(9px * var(--luz-x)) calc(9px * var(--luz-y)) 24px rgba(0, 0, 0, 0.4);
      pointer-events: none;
    }

    #toast[hidden],
    #toast button[hidden] {
      display: none;
    }

    #toast button {
      min-height: 36px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 800;
      color: var(--ui-gold);
      background: transparent;
      border: 1px solid rgba(255, 215, 0, 0.5);
      border-radius: 8px;
      cursor: pointer;
      pointer-events: auto;
    }

    /* Telas bem estreitas (ex.: 320px): ícones um pouco menores para as barras não se encostarem */
    @media (max-width: 359px) {
      .barra {
        gap: 4px;
      }
      .barra-esq {
        left: max(8px, env(safe-area-inset-left, 0px));
      }
      .barra-dir {
        right: max(8px, env(safe-area-inset-right, 0px));
      }
      .icone {
        width: 40px;
        height: 40px;
      }
      .faces {
        height: 40px;
      }
      .faces .icone {
        width: 32px;
        height: 38px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #btn-todos.rodando,
      .badge-sorteado {
        animation: none !important;
      }
    }
  </style>
</head>
<body>

    <button type="button" class="icone" id="btn-todos" aria-pressed="false" data-tip="Draw all in sequence" aria-label="Draw all in sequence"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6h11M10 12h11M10 18h11"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></svg></button>
    <button type="button" class="icone" id="btn-som" aria-pressed="true" data-tip="Sound on (S)" aria-label="Sound on"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg></button>

    <div class="hud-acoes">
      <button type="button" class="icone" id="btn-parar" data-tip="Stop" aria-label="Stop" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
      <button type="button" class="icone" id="btn-copiar" data-tip="Copy order" aria-label="Copy draw order"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
      <button type="button" class="icone" id="btn-limpar" data-tip="Reset" aria-label="Reset results"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>

  </section>

  <div id="toast" role="status" hidden>
    <span id="toast-texto"></span>

  <div id="palco">
    <div id="wrapper">
      <div id="piao"></div>
      <div id="moldura"></div>
      <div id="piao-bg"></div>
      <div id="piao-sombra"></div>
      <div id="aro-oclusao"></div>
    </div>
  </div>

  <div id="moldura-sombra" aria-hidden="true"></div>
  <div id="area-giro" role="button" tabindex="0" aria-label="Pião. Double-tap or drag to spin"></div>
  <div id="decoracao"></div>

  <script type="text/javascript">
    (function () {
      var $ = function (sel) { return document.querySelector(sel) }

      var piao = $('#piao')
      var btnMenosFaces = $('#btn-menos-faces')
      var btnMaisFaces = $('#btn-mais-faces')
      var facesValor = $('#faces-valor')
      var btnRotulos = $('#btn-rotulos')
      var btnRoda = $('#btn-roda')
      var btnTodos = $('#btn-todos')
      var btnSom = $('#btn-som')
      var btnTelaCheia = $('#btn-tela-cheia')
      var anuncio = $('#anuncio')
      var hud = $('#hud-sorteados')
      var listaSorteados = $('#lista-sorteados')
      var btnCopiar = $('#btn-copiar')
      var btnLimpar = $('#btn-limpar')
      var btnParar = $('#btn-parar')
      var toast = $('#toast')
      var toastTexto = $('#toast-texto')
      var toastAcao = $('#toast-acao')

      var ICONE_SOM = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>'
      var ICONE_MUDO = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6M16 9l6 6"/></svg>'
      var TITULO_BASE = 'Pião — Spinning Draw'
      var RAIO_CILINDRO = 165
      var VEL_BASE = 360 / 0.55 // graus/s
      var MIN_FACES = 2, MAX_FACES = 15
      var RESERVA_TOPO = 64 // barra de ícones
      var reduzirMovimento = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)

      // Estado inicial; nada é salvo: recarregar a página volta a ele
      var cfg = { modo: 'unico', faces: 6, rotulos: 'numeros', tirarDaRoda: false, som: true }

      // Estado de execução
      var historico = [] // números sorteados, em ordem
      var girando = false
      var segurando = false
      var sequenciaAtiva = false
      var idSequencia = 0
      var ultimaSequenciaCompleta = false
      var anguloAcumulado = 0
      var animFrameId = null
      var arrastando = false

      function limitar(n, min, max) {
        return Math.min(max, Math.max(min, Math.round(n)))
      }

      // ---------- Rótulos ----------
      function rotulo(num) {
        return cfg.rotulos === 'letras' ? String.fromCharCode(64 + num) : String(num)
      }

      // ---------- Construção do pião 3D (inalterado) ----------
      // Número grande como no programa (~60% da altura da face), limitado pela largura:
      // um caractere de grotesca pesada ocupa ~0,7em; dois, ~1,4em
      function calcularFontSize(width, numero, altura) {
        var numCaracteres = rotulo(numero).length
        var pelaAltura = (altura || width * 1.6) * 0.8
        var pelaLargura = width * (numCaracteres > 1 ? 0.62 : 1.15)
        var fontSize = Math.max(28, Math.round(Math.min(pelaAltura, pelaLargura)))
        if (cfg.rotulos === 'letras') fontSize = Math.round(fontSize * 0.9)
        return fontSize
      }

      // ---------- Dimensionamento do tambor ----------
      // Como no programa: o tambor enche a janela do aro e os cantos da face da frente ficam
      // exatamente na borda interna da moldura (DIST_CANTO), escondidos atrás dela; as faces
      // laterais são cortadas pelo aro. Vale para qualquer quantidade de faces. Abaixo de 6 a
      // face mantém a proporção da face de 6 (altura = PROPORCAO_FACE × largura).
      var sombraTambor = document.getElementById('piao-sombra')
      var PERSPECTIVA = 900 // ≈ lente de 85 mm para um objeto de ~400px: proporções fiéis, pouca distorção
      var EMPURRAO = 0
      var ALTURA_PADRAO = 270
      var DIST_CANTO = 203 // cantos da face da frente na borda interna do aro (raio 200): os vértices ficam atrás da moldura
      var PROPORCAO_FACE = ALTURA_PADRAO / (2 * RAIO_CILINDRO * Math.sin(Math.PI / 6))

      // Cantos (x, z) de cada face no referencial do tambor em repouso
      function cantosFaces(n, g) {
        var lista = []
        for (var i = 0; i < n; i++) {
          var b = 2 * Math.PI * i / n
          for (var lado = -1; lado <= 1; lado += 2) {
            var u = lado * g.w / 2
            lista.push({ x: u * Math.cos(b) + g.r * Math.sin(b), z: -u * Math.sin(b) + g.r * Math.cos(b), visivel: Math.cos(b) > 0.02 })
          }
        }
        return lista
      }

      // Mesmo caminho do CSS: translateZ(−recuo) rotateY … + perspectiva
      function projetar(x, y, z, recuo) {
        var s = PERSPECTIVA / (PERSPECTIVA - (z - recuo - EMPURRAO))
        return { x: x * s, y: y * s }
      }

      // Extensão projetada do tambor em repouso (faces visíveis) e distância do canto da face da frente
      function extensao(n, g) {
        var c = cantosFaces(n, g), mx = 0, my = 0
        for (var i = 0; i < c.length; i++) {
          if (!c[i].visivel) continue
          var q = projetar(c[i].x, g.h / 2, c[i].z, g.recuo)
          mx = Math.max(mx, Math.abs(q.x))
          my = Math.max(my, Math.abs(q.y))
        }
        var f = projetar(g.w / 2, g.h / 2, g.r, g.recuo)
        return { canto: Math.sqrt(f.x * f.x + f.y * f.y), x: mx, y: my }
      }

      function geometria(n) {
        var base
        if (n === 2) {
          base = { r: 24, recuo: 24, w: 188, h: PROPORCAO_FACE * 188 } // duas faces de costas
        } else {
          var R = RAIO_CILINDRO
          var w = 2 * R * Math.sin(Math.PI / n)
          base = { r: R * Math.cos(Math.PI / n), recuo: R, w: w + 0.6, h: n < 6 ? PROPORCAO_FACE * w : ALTURA_PADRAO }
        }
        // escala uniforme para o ponto mais externo cair em DIST_CANTO
        var lo = 0.2, hi = 3, g = base
        for (var it = 0; it < 40; it++) {
          var k = (lo + hi) / 2
          g = { r: base.r * k, recuo: base.recuo * k, w: base.w * k, h: base.h * k }
          if (extensao(n, g).canto > DIST_CANTO) hi = k
          else lo = k
        }
        return g
      }

      // Geometria de cada face: elemento, ângulo base, raio, recuo do tambor e largura
      var facesGeo = []

      function construirPiao(n) {
        piao.innerHTML = ''
        facesGeo = []
        anguloAcumulado = 0
        var g = geometria(n)
        for (var i = 0; i < n; i++) {
          var num = i + 1
          var face = document.createElement('div')
          face.className = 'numero'
          face.setAttribute('data-num', String(num))
          face.textContent = rotulo(num)
          face.style.width = g.w.toFixed(2) + 'px'
          face.style.height = g.h.toFixed(2) + 'px'
          face.style.left = '50%'
          face.style.top = ((ALTURA_PADRAO - g.h) / 2).toFixed(2) + 'px'
          face.style.marginLeft = (-g.w / 2).toFixed(2) + 'px'
          face.style.fontSize = calcularFontSize(g.w, num, g.h) + 'px'
          var reflexo = document.createElement('div')
          reflexo.className = 'reflexo'
          face.appendChild(reflexo)
          piao.appendChild(face)
          facesGeo.push({ el: face, base: i * 360 / n, r: g.r, recuo: g.recuo, w: g.w })
        }
        var ext = extensao(n, g)
        sombraTambor.style.width = (2 * ext.x * 1.12).toFixed(1) + 'px'
        sombraTambor.style.height = (2 * ext.y * 1.06).toFixed(1) + 'px'
        aplicarRotacao(0)
      }

      // "No repeats": sempre ativo na sequência; no um por vez, opção do usuário
      function semRepetirAtivo() {
        return cfg.modo === 'sequencia' || cfg.tirarDaRoda
      }

      // Faces que ainda não saíram (um por vez com "No repeats")
      function restantes() {
        var r = []
        for (var c = 1; c <= cfg.faces; c++) if (historico.indexOf(c) === -1) r.push(c)
        return r
      }

      function rodaEsgotada() {
        return cfg.modo === 'unico' && cfg.tirarDaRoda && restantes().length === 0
      }

      function vencedorForcado() {
        return (cfg.modo === 'unico' && cfg.tirarDaRoda) ? sortearEntre(restantes()) : undefined
      }

      function recomecar() {
        if (!emRepouso()) return
        limparHistorico()
        atualizarTudo()
        mostrarToast('Restarted')
      }

      function sortearEntre(lista) {
        return lista[Math.floor(Math.random() * lista.length)]
      }

      // ---------- Áudio (Web Audio API) ----------
      // A trilha é baixada e decodificada uma vez num AudioBuffer. O AudioContext é destravado
      // (resume) em gestos do usuário; depois disso cada giro cria um AudioBufferSourceNode e
      // toca na hora, sem passar pelas regras de play() do <audio> (gesto por chamada,
      // autoplay, seek). No iOS a sessão é "playback" para não ser silenciada pela chave lateral.
      var ARQUIVOS_TRILHA = ['piao-da-casa-propria-soundtrack.mp3', 'piao-da-casa-propria-soundtrack.m4a', 'piao-da-casa-propria-soundtrack.ogg']
      var FADE_S = 0.08
      var ctxAudio = null
      var ganhoMestre = null
      var bufferTrilha = null
      var fonteAtual = null
      var ganhoFonte = null
      var musicaDesejada = false

      function criarContextoAudio() {
        if (ctxAudio) return ctxAudio
        var Ctx = window.AudioContext || window.webkitAudioContext
        if (!Ctx) return null
        try {
          if (navigator.audioSession) navigator.audioSession.type = 'playback'
        } catch (e) {}
        ctxAudio = new Ctx()
        ganhoMestre = ctxAudio.createGain()
        ganhoMestre.connect(ctxAudio.destination)
        carregarTrilha(0)
        return ctxAudio
      }

      function decodificar(dados) {
        return new Promise(function (ok, falha) {
          // forma com callbacks: compatível com Safari antigo
          ctxAudio.decodeAudioData(dados, ok, falha)
        })
      }

      function carregarTrilha(indice) {
        if (indice >= ARQUIVOS_TRILHA.length) return
        fetch(ARQUIVOS_TRILHA[indice])
          .then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status)
            return r.arrayBuffer()
          })
          .then(decodificar)
          .then(function (buffer) {
            bufferTrilha = buffer
            if (musicaDesejada) iniciarFonte()
          })
          .catch(function () { carregarTrilha(indice + 1) })
      }

      // Chamado em todo gesto: cria/retoma o contexto (iOS pode suspendê-lo ou "interrompê-lo")
      function liberarAudioIOS() {
        if (!cfg.som) return
        var ctx = criarContextoAudio()
        if (ctx && ctx.state !== 'running' && ctx.state !== 'closed') {
          var r = ctx.resume()
          if (r && r.catch) r.catch(function () {})
        }
      }

      function pararFonte() {
        if (!fonteAtual) return
        var fonte = fonteAtual, ganho = ganhoFonte
        fonteAtual = ganhoFonte = null
        try {
          var t = ctxAudio.currentTime
          ganho.gain.cancelScheduledValues(t)
          ganho.gain.setValueAtTime(ganho.gain.value, t)
          ganho.gain.linearRampToValueAtTime(0, t + FADE_S)
          fonte.stop(t + FADE_S + 0.02)
        } catch (e) {
          try { fonte.stop() } catch (e2) {}
        }
      }

      function iniciarFonte() {
        if (!ctxAudio || !bufferTrilha) return
        pararFonte()
        var fonte = ctxAudio.createBufferSource()
        fonte.buffer = bufferTrilha
        fonte.loop = true
        var ganho = ctxAudio.createGain()
        ganho.gain.value = 1
        fonte.connect(ganho)
        ganho.connect(ganhoMestre)
        fonte.start(0)
        fonteAtual = fonte
        ganhoFonte = ganho
      }

      function tocarMusica() {
        if (!cfg.som) return
        musicaDesejada = true
        liberarAudioIOS()
        iniciarFonte() // se o buffer ainda está carregando, começa assim que ficar pronto
      }

      function continuarMusica() {
        if (!cfg.som) return
        musicaDesejada = true
        liberarAudioIOS()
        if (!fonteAtual) iniciarFonte()
      }

      function pararMusica() {
        musicaDesejada = false
        pararFonte()
      }

      // Para depuração e testes: estado real do motor de áudio
      window.__piaoAudio = function () {
        return {
          contexto: ctxAudio ? ctxAudio.state : 'nenhum',
          carregado: !!bufferTrilha,
          tocando: !!fonteAtual,
          audivel: !!(fonteAtual && ctxAudio && ctxAudio.state === 'running')
        }
      }

      function definirSom(ligado) {
        cfg.som = !!ligado
        if (!cfg.som) {
          pararMusica()
        } else if (girando || sequenciaAtiva || segurando) {
          continuarMusica()
        }
        btnSom.setAttribute('aria-pressed', String(cfg.som))
        btnSom.innerHTML = cfg.som ? ICONE_SOM : ICONE_MUDO
        btnSom.setAttribute('aria-label', cfg.som ? 'Sound on' : 'Sound off')
        btnSom.setAttribute('data-tip', (cfg.som ? 'Sound on' : 'Sound off') + ' (S)')
      }

      // ---------- Estado dos ícones ----------
      function emRepouso() {
        return !(girando || sequenciaAtiva || segurando || arrastando)
      }

      function atualizarTudo() {
        var livre = emRepouso()
        facesValor.textContent = String(cfg.faces)
        btnMenosFaces.disabled = !livre || cfg.faces <= MIN_FACES
        btnMaisFaces.disabled = !livre || cfg.faces >= MAX_FACES
        var letras = cfg.rotulos === 'letras'
        btnRotulos.textContent = letras ? 'ABC' : '123'
        btnRotulos.setAttribute('data-tip', letras ? 'Switch to numbers' : 'Switch to letters')
        btnRotulos.setAttribute('aria-label', letras ? 'Faces show letters. Switch to numbers' : 'Faces show numbers. Switch to letters')
        btnRotulos.disabled = !livre
        btnRoda.setAttribute('aria-pressed', String(semRepetirAtivo()))
        btnRoda.disabled = !livre || cfg.modo === 'sequencia'
        btnTodos.setAttribute('aria-pressed', String(cfg.modo === 'sequencia'))
        btnTodos.classList.toggle('rodando', sequenciaAtiva)
        btnTodos.disabled = !livre
        atualizarHud()
      }

      // Para testes visuais: posiciona o pião num ângulo
      window.__piaoDefinirAngulo = function (graus) { aplicarRotacao(-graus) }

      // Para depuração e testes: estado atual (somente leitura)
      window.__piaoEstado = function () {
        return { modo: cfg.modo, faces: cfg.faces, rotulos: cfg.rotulos, naoRepetir: semRepetirAtivo(), som: cfg.som, girando: girando, sequencia: sequenciaAtiva, emRepouso: emRepouso(), historico: historico.slice(), angulo: anguloAcumulado }
      }

      // ---------- Alterações ----------
      function zerarSeNecessario() {
        if (historico.length) {
          limparHistorico()
          mostrarToast('Results cleared')
        } else {
          ultimaSequenciaCompleta = false
        }
      }

      function definirFaces(n) {
        if (!emRepouso()) return
        var novo = limitar(n, MIN_FACES, MAX_FACES)
        if (novo === cfg.faces) return
        cfg.faces = novo
        zerarSeNecessario()
        construirPiao(cfg.faces)
        atualizarTudo()
      }

      function alternarRotulos() {
        if (!emRepouso()) return
        cfg.rotulos = cfg.rotulos === 'letras' ? 'numeros' : 'letras'
        construirPiao(cfg.faces)
        renderizarHistorico()
        atualizarTudo()
      }

      function alternarModo() {
        if (!emRepouso()) return
        cfg.modo = cfg.modo === 'sequencia' ? 'unico' : 'sequencia'
        zerarSeNecessario()
        atualizarTudo()
        mostrarToast(cfg.modo === 'sequencia' ? 'Draw all in sequence' : 'One at a time')
      }

      function alternarRoda() {
        if (!emRepouso() || cfg.modo !== 'unico') return
        cfg.tirarDaRoda = !cfg.tirarDaRoda
        atualizarTudo()
        mostrarToast(cfg.tirarDaRoda ? 'No repeats' : 'Repeats allowed')
      }

      // ---------- Física do giro (inalterada, com duração configurável) ----------
      function pararAnimacaoAtual() {
        if (animFrameId) {
          cancelAnimationFrame(animFrameId)
          animFrameId = null
        }
      }

      // Iluminação (modelo de Blinn-Phong, sombreamento flat: uma intensidade por face).
      // Luz direcional principal vindo de cima/esquerda/frente; observador em +z.
      // Vetores no referencial do CSS (y para baixo). Normal de uma face girada de φ: N = (sen φ, 0, cos φ).
      var LUZ = normalizar([-0.4, -0.35, 0.85])
      var MEIO = normalizar([LUZ[0], LUZ[1], LUZ[2] + 1]) // vetor intermediário H = (L + V)/|L + V|
      var K_AMBIENTE = 0.22, K_DIFUSA = 0.78, K_ESPECULAR = 0.9, BRILHO_S = 28
      var I_MAX = 1 // exposição: definida abaixo pela face da frente em repouso

      function normalizar(v) {
        var m = Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2])
        return [v[0] / m, v[1] / m, v[2] / m]
      }

      function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2] }

      // Exposição da "câmera": a face da frente em repouso é a referência de brilho total
      I_MAX = K_AMBIENTE + K_DIFUSA * Math.max(0, dot([0, 0, 1], LUZ))


      // Cada face recebe sua própria transformação; a perspectiva vem do #piao. O tambor é
      // recuado do próprio raio, com o eixo atrás da tela. Faces de costas ficam ocultas.
      function aplicarRotacao(angulo) {
        anguloAcumulado = angulo
        for (var i = 0; i < facesGeo.length; i++) {
          var f = facesGeo[i]
          var phi = angulo + f.base
          var rad = phi * Math.PI / 180
          var sen = Math.sin(rad), cos = Math.cos(rad)
          if (cos <= 0.02) {
            if (f.visivel !== false) { f.el.style.visibility = 'hidden'; f.visivel = false }
            continue
          }
          if (f.visivel !== true) { f.el.style.visibility = ''; f.visivel = true }
          var transformacao = 'translateZ(' + (-f.recuo - EMPURRAO).toFixed(2) + 'px) rotateY(' + phi.toFixed(3) + 'deg) translateZ(' + f.r.toFixed(2) + 'px)'
          f.el.style.transform = transformacao
          f.el.style.webkitTransform = transformacao
          var N = [sen, 0, cos]
          var intensidade = K_AMBIENTE + K_DIFUSA * Math.max(0, dot(N, LUZ))
          var especular = K_ESPECULAR * Math.pow(Math.max(0, dot(N, MEIO)), BRILHO_S)
          f.el.style.setProperty('--sombra', Math.min(0.9, Math.max(0, 1 - intensidade / I_MAX)).toFixed(3))
          f.el.style.setProperty('--brilho', especular.toFixed(3))
        }
      }

      // Tempos de giro (s): mínimo mais longo e teto de 7 s em qualquer giro
      var TEMPO_GIRO_MIN = 4, TEMPO_GIRO_MAX = 7

      function duracaoGiro(forca) {
        if (reduzirMovimento) return 1.2
        return TEMPO_GIRO_MIN + (TEMPO_GIRO_MAX - 0.5 - TEMPO_GIRO_MIN) * forca
      }

      // Na sequência, cada giro dura um tempo aleatório entre o mínimo e 7 s
      function tempoAleatorio() {
        if (reduzirMovimento) return 1.2
        return TEMPO_GIRO_MIN + Math.random() * (TEMPO_GIRO_MAX - 0.3 - TEMPO_GIRO_MIN)
      }

      var concluirGiroAtual = null // termina o giro em andamento na face já sorteada (botão stop)
      var arrasteSentidoPositivo = false // só um giro vindo do arraste pode ir no sentido positivo

      function executarDesaceleracaoFisica(n, omega0, T_desejado, callback, forcedWinnerNum) {
        pararAnimacaoAtual()
        girando = true
        var winnerNum = (typeof forcedWinnerNum === 'number') ? forcedWinnerNum : (Math.floor(Math.random() * n) + 1)
        var anguloPasso = 360 / n
        var alvoAngulo = -((winnerNum - 1) * anguloPasso)
        // sentido: velocidade positiva (arrastar para a direita) gira para o outro lado
        var sentido = omega0 > 0 && arrasteSentidoPositivo ? 1 : -1
        arrasteSentidoPositivo = false
        omega0 = Math.abs(omega0)
        var p = 2.2
        var S_ideal = (omega0 * T_desejado) / p
        var anguloInicial = anguloAcumulado
        var diff = (sentido < 0 ? (anguloInicial - alvoAngulo) : (alvoAngulo - anguloInicial)) % 360
        if (diff < 0) diff += 360
        var voltas = Math.round((S_ideal - diff) / 360)
        if (voltas < 1) voltas = 1
        var tempoDe = function (v) { return p * (v * 360 + diff) / omega0 }
        if (!reduzirMovimento) {
          while (voltas > 1 && tempoDe(voltas) > TEMPO_GIRO_MAX) voltas--
          while (tempoDe(voltas) < T_desejado * 0.9 && tempoDe(voltas + 1) <= TEMPO_GIRO_MAX) voltas++
        }
        var S_real = voltas * 360 + diff
        if (!reduzirMovimento && tempoDe(voltas) > TEMPO_GIRO_MAX) omega0 = p * S_real / TEMPO_GIRO_MAX // giro muito lento: acelera
        var anguloFinal = anguloInicial + sentido * S_real
        var duracaoMs = ((p * S_real) / omega0) * 1000
        var tempoInicio = performance.now()
        function concluir() {
          pararAnimacaoAtual()
          concluirGiroAtual = null
          aplicarRotacao(anguloFinal)
          girando = false
          if (!sequenciaAtiva) pararMusica()
          if (callback) callback(winnerNum)
        }
        concluirGiroAtual = concluir
        function frame(agora) {
          var u = Math.min(1, Math.max(0, (agora - tempoInicio) / duracaoMs))
          aplicarRotacao(anguloInicial + sentido * S_real * (1 - Math.pow(1 - u, p)))
          if (u < 1) animFrameId = requestAnimationFrame(frame)
          else concluir()
        }
        animFrameId = requestAnimationFrame(frame)
      }

      // ---------- Resultado ----------
      function mostrarResultado(num, prefixo) {
        var r = rotulo(num)
        anuncio.textContent = prefixo + ': ' + r
        document.title = r + ' — Pião'
      }

      // ---------- Histórico ----------
      function renderizarHistorico() {
        listaSorteados.innerHTML = ''
        for (var i = 0; i < historico.length; i++) {
          listaSorteados.appendChild(criarBadge(i + 1, historico[i], i === historico.length - 1))
        }
        atualizarHud()
      }

      function criarBadge(ordem, num, recente) {
        var li = document.createElement('li')
        li.className = 'badge-sorteado' + (recente ? ' recente' : '')
        li.innerHTML = '<span class="sr-only">' + ordinal(ordem) + ': </span><span class="numero-sorteado">' + rotulo(num) + '</span>'
        return li
      }

      function adicionarHistorico(num) {
        historico.push(num)
        var anteriores = listaSorteados.querySelectorAll('.recente')
        for (var i = 0; i < anteriores.length; i++) anteriores[i].classList.remove('recente')
        listaSorteados.appendChild(criarBadge(historico.length, num, true))
        listaSorteados.scrollLeft = listaSorteados.scrollWidth
        atualizarHud()
      }

      function atualizarHud() {
        listaSorteados.hidden = historico.length === 0
        btnParar.disabled = !(girando || sequenciaAtiva || segurando)
        hud.classList.toggle('completo', ultimaSequenciaCompleta || rodaEsgotada())
        btnLimpar.disabled = sequenciaAtiva || girando || historico.length === 0
        btnCopiar.disabled = historico.length === 0
      }

      function limparHistorico() {
        historico = []
        ultimaSequenciaCompleta = false
        renderizarHistorico()
        document.title = TITULO_BASE
      }

      // Confirmação de "copiado" no padrão usual (GitHub, VS Code): o ícone vira um ✓ por um
      // instante e volta; sem texto e sem repetir o efeito de apertar
      var ICONE_COPIAR = btnCopiar.innerHTML
      var ICONE_OK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>'
      var copiadoTimer = null
      function confirmarCopia() {
        btnCopiar.innerHTML = ICONE_OK
        btnCopiar.classList.add('confirmado')
        btnCopiar.setAttribute('aria-label', 'Copied')
        if (copiadoTimer) window.clearTimeout(copiadoTimer)
        copiadoTimer = window.setTimeout(function () {
          btnCopiar.innerHTML = ICONE_COPIAR
          btnCopiar.classList.remove('confirmado')
          btnCopiar.setAttribute('aria-label', 'Copy draw order')
        }, 1500)
      }

      // 1st, 2nd, 3rd, 4th … 11th, 12th, 13th, 21st …
      function ordinal(n) {
        var d = n % 100
        if (d >= 11 && d <= 13) return n + 'th'
        return n + ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th')
      }

      function copiarOrdem() {
        if (!historico.length) return
        var partes = []
        for (var i = 0; i < historico.length; i++) partes.push(ordinal(i + 1) + ' ' + rotulo(historico[i]))
        var texto = 'Draw order: ' + partes.join(', ')
        var ok = confirmarCopia
        var falhou = function () { mostrarToast('Could not copy') }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(texto).then(ok, function () { copiarFallback(texto) ? ok() : falhou() })
        } else {
          copiarFallback(texto) ? ok() : falhou()
        }
      }

      function copiarFallback(texto) {
        try {
          var ta = document.createElement('textarea')
          ta.value = texto
          ta.setAttribute('readonly', '')
          ta.style.position = 'fixed'
          ta.style.opacity = '0'
          document.body.appendChild(ta)
          ta.select()
          var ok = document.execCommand('copy')
          document.body.removeChild(ta)
          return ok
        } catch (e) {
          return false
        }
      }

      // ---------- Toast ----------
      var toastTimer = null
      function mostrarToast(texto, acaoTexto, acao, duracaoMs) {
        toastTexto.textContent = texto
        if (acaoTexto && acao) {
          toastAcao.textContent = acaoTexto
          toastAcao.hidden = false
          toastAcao.onclick = function () {
            esconderToast()
            acao()
          }
        } else {
          toastAcao.hidden = true
          toastAcao.onclick = null
        }
        toast.hidden = false
        if (toastTimer) window.clearTimeout(toastTimer)
        toastTimer = window.setTimeout(esconderToast, duracaoMs || 2600)
      }

      function esconderToast() {
        if (toastTimer) window.clearTimeout(toastTimer)
        toastTimer = null
        toast.hidden = true
      }

      // ---------- Tela cheia ----------
      var raiz = document.documentElement
      // Só em telas com mouse/trackpad (desktop/notebook): no celular/tablet não faz sentido
      var telaDeToque = !!(window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches)
      var suportaTelaCheia = !telaDeToque && !!((raiz.requestFullscreen || raiz.webkitRequestFullscreen) && (document.fullscreenEnabled || document.webkitFullscreenEnabled))
      function emTelaCheia() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement)
      }

      function alternarTelaCheia() {
        if (!suportaTelaCheia) return
        try {
          if (emTelaCheia()) {
            (document.exitFullscreen || document.webkitExitFullscreen).call(document)
          } else {
            var r = (raiz.requestFullscreen || raiz.webkitRequestFullscreen).call(raiz)
            if (r && r.catch) r.catch(function () {})
          }
        } catch (e) {}
      }

      function atualizarBotaoTelaCheia() {
        var on = emTelaCheia()
        btnTelaCheia.setAttribute('aria-pressed', String(on))
        btnTelaCheia.setAttribute('data-tip', (on ? 'Exit fullscreen' : 'Fullscreen') + ' (F)')
        btnTelaCheia.setAttribute('aria-label', on ? 'Exit fullscreen' : 'Fullscreen')
      }

      // ---------- Giro "um por vez" ----------
      var tempoInicioSegurar = 0
      var forcaAtual = 0
      var velAtual = VEL_BASE

      function forcaDe(ms) {
        return Math.min(1, Math.max(0, ms / 1200))
      }

      function podeGirarUnico() {
        return cfg.modo === 'unico' && emRepouso() && !rodaEsgotada()
      }

      function aoTerminarGiroUnico(num) {
        adicionarHistorico(num)
        mostrarResultado(num, 'Drawn')
        if (rodaEsgotada()) mostrarToast('Everyone has been drawn', 'Restart', recomecar, 5000)
        atualizarTudo()
      }

      function prepararGiro() {
        atualizarTudo()
      }

      function iniciarSegurar() {
        if (!podeGirarUnico()) return
        liberarAudioIOS()
        pararAnimacaoAtual()
        prepararGiro()
        segurando = true
        tempoInicioSegurar = performance.now()
        forcaAtual = 0
        tocarMusica()
        atualizarTudo()
        var ultimo = tempoInicioSegurar
        function loopGiro(agora) {
          if (!segurando) return
          var dt = Math.max(0, agora - ultimo) / 1000
          ultimo = agora
          forcaAtual = forcaDe(agora - tempoInicioSegurar)
          velAtual = VEL_BASE * (0.55 + 0.45 * forcaAtual)
          aplicarRotacao(anguloAcumulado - velAtual * dt)
          animFrameId = requestAnimationFrame(loopGiro)
        }
        animFrameId = requestAnimationFrame(loopGiro)
      }

      function finalizarSegurar() {
        if (!segurando) return
        segurando = false
        forcaAtual = forcaDe(performance.now() - tempoInicioSegurar)
        var omega = VEL_BASE * (0.55 + 0.45 * forcaAtual)
        executarDesaceleracaoFisica(cfg.faces, omega, duracaoGiro(forcaAtual), aoTerminarGiroUnico, vencedorForcado())
        atualizarTudo()
      }

      function girarUmaVez() {
        if (!podeGirarUnico()) return
        prepararGiro()
        tocarMusica()
        executarDesaceleracaoFisica(cfg.faces, VEL_BASE * 0.8, duracaoGiro(0.5), aoTerminarGiroUnico, vencedorForcado())
        atualizarTudo()
      }

      // ---------- Sequência ----------
      function iniciarSequencia(primeiroGiro) {
        if (!emRepouso()) return
        var total = cfg.faces
        var n = cfg.faces
        var semRepetir = true // a sequência nunca repete
        var meuId = ++idSequencia
        sequenciaAtiva = true
        ultimaSequenciaCompleta = false
        esconderToast()
        tocarMusica()
        historico = []
        renderizarHistorico()
        atualizarTudo()
        var tempoPausa = reduzirMovimento ? 900 : 1400
        function proximo() {
          if (meuId !== idSequencia || !sequenciaAtiva) return
          if (historico.length >= total) {
            encerrarSequencia(true)
            return
          }
          var forcedNum // com repetição: qualquer face
          if (semRepetir) {
            var disponiveis = []
            for (var c = 1; c <= n; c++) if (historico.indexOf(c) === -1) disponiveis.push(c)
            if (!disponiveis.length) {
              encerrarSequencia(true)
              return
            }
            forcedNum = sortearEntre(disponiveis)
          }
          continuarMusica()
          var omegaGiro = VEL_BASE, tempoGiro = tempoAleatorio()
          if (primeiroGiro) {
            omegaGiro = primeiroGiro.omega
            tempoGiro = primeiroGiro.tempo
            arrasteSentidoPositivo = primeiroGiro.omega > 0
            primeiroGiro = null
          }
          executarDesaceleracaoFisica(n, omegaGiro, tempoGiro, function (num) {
            if (!sequenciaAtiva || meuId !== idSequencia) return
            adicionarHistorico(num)
            mostrarResultado(num, ordinal(historico.length) + ' drawn')
            atualizarTudo()
            window.setTimeout(function () {
              if (sequenciaAtiva && meuId === idSequencia) proximo()
            }, tempoPausa)
          }, forcedNum)
          atualizarTudo()
        }
        proximo()
      }

      function encerrarSequencia(completa) {
        idSequencia++
        var estavaAtiva = sequenciaAtiva
        sequenciaAtiva = false
        pararMusica()
        pararAnimacaoAtual()
        concluirGiroAtual = null
        girando = false
        ultimaSequenciaCompleta = !!completa
        if (estavaAtiva) {
          if (!completa) mostrarToast('Sequence stopped')
        }
        atualizarTudo()
      }

      // ---------- Girar o pião com o dedo / mouse ----------
      // O pião é um cilindro em torno do eixo vertical: arrastar na horizontal gira o "rolo".
      // A face acompanha o dedo; ao soltar, a velocidade dos últimos ~100 ms (como o
      // VelocityTracker do Android) vira a velocidade inicial e define o tempo de giro.
      var areaGiro = $('#area-giro')
      var JANELA_VELOCIDADE_MS = 100
      var VEL_MIN_SORTEIO = 400   // graus/s: abaixo disso não sorteia, só realinha
      var VEL_MAX = 3000          // graus/s
      var TEMPO_MIN = TEMPO_GIRO_MIN, TEMPO_MAX = TEMPO_GIRO_MAX - 0.3 // segundos
      var arraste = null

      function grausPorPixel() {
        var escala = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--escala')) || 1
        return 180 / (Math.PI * RAIO_CILINDRO * escala)
      }

      // Velocidade no instante final por mínimos quadrados de 2ª ordem (a + b·t + c·t²; v = b)
      function velocidadeFinal(amostras) {
        if (amostras.length < 2) return 0
        var tf = amostras[amostras.length - 1].t
        if (amostras.length === 2) {
          var dt = (tf - amostras[0].t) / 1000
          return dt > 0 ? (amostras[1].a - amostras[0].a) / dt : 0
        }
        var S0 = 0, S1 = 0, S2 = 0, S3 = 0, S4 = 0, Y0 = 0, Y1 = 0, Y2 = 0
        for (var i = 0; i < amostras.length; i++) {
          var t = (amostras[i].t - tf) / 1000
          var y = amostras[i].a
          var t2 = t * t
          S0 += 1; S1 += t; S2 += t2; S3 += t2 * t; S4 += t2 * t2
          Y0 += y; Y1 += y * t; Y2 += y * t2
        }
        // Resolve [S0 S1 S2; S1 S2 S3; S2 S3 S4]·[a b c] = [Y0 Y1 Y2] (regra de Cramer para b)
        var det = S0 * (S2 * S4 - S3 * S3) - S1 * (S1 * S4 - S3 * S2) + S2 * (S1 * S3 - S2 * S2)
        if (Math.abs(det) < 1e-12) {
          var dt2 = (tf - amostras[0].t) / 1000
          return dt2 > 0 ? (amostras[amostras.length - 1].a - amostras[0].a) / dt2 : 0
        }
        var detB = S0 * (Y1 * S4 - S3 * Y2) - Y0 * (S1 * S4 - S3 * S2) + S2 * (S1 * Y2 - Y1 * S2)
        return detB / det
      }

      function tempoPelaVelocidade(v) {
        if (reduzirMovimento) return 1.2
        var f = (v - VEL_MIN_SORTEIO) / (VEL_MAX - VEL_MIN_SORTEIO)
        return TEMPO_MIN + Math.min(1, Math.max(0, f)) * (TEMPO_MAX - TEMPO_MIN)
      }

      function podeArrastar() {
        return emRepouso() && !rodaEsgotada()
      }

      function alinharFaceMaisProxima() {
        var passo = 360 / cfg.faces
        var inicio = anguloAcumulado
        var alvo = Math.round(inicio / passo) * passo
        if (Math.abs(alvo - inicio) < 0.01) return
        var t0 = performance.now(), dur = 260
        pararAnimacaoAtual()
        function frame(agora) {
          var u = Math.min(1, (agora - t0) / dur)
          aplicarRotacao(inicio + (alvo - inicio) * (1 - Math.pow(1 - u, 3)))
          if (u < 1) animFrameId = requestAnimationFrame(frame)
          else animFrameId = null
        }
        animFrameId = requestAnimationFrame(frame)
      }

      areaGiro.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return
        if (!podeArrastar()) return
        e.preventDefault()
        liberarAudioIOS()
        pararAnimacaoAtual()
        try { areaGiro.setPointerCapture(e.pointerId) } catch (err) {}
        var agora = performance.now()
        arraste = { id: e.pointerId, x0: e.clientX, a0: anguloAcumulado, k: grausPorPixel(), amostras: [{ t: agora, a: anguloAcumulado }] }
        arrastando = true
        areaGiro.classList.add('arrastando')
        atualizarTudo()
      })

      areaGiro.addEventListener('pointermove', function (e) {
        if (!arraste || e.pointerId !== arraste.id) return
        var agora = performance.now()
        var a = arraste.a0 + (e.clientX - arraste.x0) * arraste.k
        aplicarRotacao(a)
        arraste.amostras.push({ t: agora, a: a })
        while (arraste.amostras.length > 2 && agora - arraste.amostras[0].t > JANELA_VELOCIDADE_MS) arraste.amostras.shift()
      })

      function soltarArraste(e, cancelado) {
        if (!arraste || (e && e.pointerId !== arraste.id)) return
        var agora = performance.now()
        var recentes = arraste.amostras.filter(function (s) { return agora - s.t <= JANELA_VELOCIDADE_MS })
        var v = cancelado ? 0 : velocidadeFinal(recentes)
        arraste = null
        arrastando = false
        areaGiro.classList.remove('arrastando')
        var modulo = Math.min(VEL_MAX, Math.abs(v))
        if (modulo < VEL_MIN_SORTEIO) {
          alinharFaceMaisProxima()
          atualizarTudo()
          return
        }
        var omega = (v < 0 ? -1 : 1) * modulo
        var tempo = tempoPelaVelocidade(modulo)
        if (cfg.modo === 'unico') {
          prepararGiro()
          tocarMusica()
          arrasteSentidoPositivo = omega > 0
          executarDesaceleracaoFisica(cfg.faces, omega, tempo, aoTerminarGiroUnico, vencedorForcado())
          atualizarTudo()
        } else {
          iniciarSequencia({ omega: omega, tempo: tempo })
        }
      }

      areaGiro.addEventListener('pointerup', function (e) { soltarArraste(e, false) })
      areaGiro.addEventListener('pointercancel', function (e) { soltarArraste(e, true) })
      areaGiro.addEventListener('lostpointercapture', function (e) { soltarArraste(e, false) })
      areaGiro.addEventListener('contextmenu', function (e) { e.preventDefault() })

      // ---------- Ação: dois toques no pião (ou Enter/Espaço) ----------
      function dispararAcao() {
        liberarAudioIOS()
        if (sequenciaAtiva) {
          encerrarSequencia(false)
          return
        }
        if (!emRepouso()) return
        if (cfg.modo !== 'unico') {
          iniciarSequencia()
        } else if (rodaEsgotada()) {
          recomecar()
        } else {
          girarUmaVez()
        }
      }

      // Registrado depois do arraste: num toque, o arraste termina (sem sortear) antes daqui
      var DOIS_TOQUES_MS = 350
      var toqueInicio = null
      var ultimoToque = null
      areaGiro.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return
        toqueInicio = { x: e.clientX, y: e.clientY, t: performance.now() }
      })
      areaGiro.addEventListener('pointerup', function (e) {
        if (!toqueInicio) return
        var agora = performance.now()
        var foiToque = Math.abs(e.clientX - toqueInicio.x) < 10 && Math.abs(e.clientY - toqueInicio.y) < 10 && agora - toqueInicio.t < 350
        toqueInicio = null
        if (!foiToque) {
          ultimoToque = null
          return
        }
        if (ultimoToque && agora - ultimoToque.t < DOIS_TOQUES_MS && Math.abs(e.clientX - ultimoToque.x) < 40 && Math.abs(e.clientY - ultimoToque.y) < 40) {
          ultimoToque = null
          dispararAcao()
        } else {
          ultimoToque = { x: e.clientX, y: e.clientY, t: agora }
        }
      })
      areaGiro.addEventListener('dblclick', function (e) { e.preventDefault() })

      // ---------- Teclado ----------
      window.addEventListener('keydown', function (e) {
        if (e.ctrlKey || e.metaKey || e.altKey) return
        var alvo = e.target
        var emOutroControle = alvo && alvo.tagName === 'BUTTON'
        if (e.code === 'Space' || e.key === ' ') {
          if (emOutroControle) return
          e.preventDefault()
          if (e.repeat) return
          if (cfg.modo === 'unico' && !sequenciaAtiva) {
            if (podeGirarUnico()) iniciarSegurar()
            else if (emRepouso()) dispararAcao()
          } else {
            dispararAcao()
          }
          return
        }
        if (e.key === 'Enter') {
          if (emOutroControle) return
          e.preventDefault()
          dispararAcao()
          return
        }
        if (e.key === 'Escape') {
          if (sequenciaAtiva) encerrarSequencia(false)
          return
        }
        var k = (e.key || '').toLowerCase()
        if (k === 's') { liberarAudioIOS(); definirSom(!cfg.som) }
        else if (k === 'f') alternarTelaCheia()
      })

      // Se a janela perde o foco com o Espaço segurado, o keyup nunca chega: solta o giro
      window.addEventListener('blur', function () {
        if (segurando) finalizarSegurar()
      })

      window.addEventListener('keyup', function (e) {
        if (e.code !== 'Space' && e.key !== ' ') return
        if (segurando) {
          e.preventDefault()
          finalizarSegurar()
        }
      })

      // ---------- Ícones ----------
      // O Safari do iOS só aplica :active (retorno de toque) se a página ouvir touchstart
      document.addEventListener('touchstart', function () {}, { passive: true })

      // Clique de mouse não deixa o foco no ícone: Espaço/Enter continuam girando o pião
      document.querySelectorAll('.icone').forEach(function (el) {
        el.addEventListener('mousedown', function (e) { e.preventDefault() })
      })
      btnMenosFaces.addEventListener('click', function () { definirFaces(cfg.faces - 1) })
      btnMaisFaces.addEventListener('click', function () { definirFaces(cfg.faces + 1) })
      btnRotulos.addEventListener('click', alternarRotulos)
      btnRoda.addEventListener('click', alternarRoda)
      btnTodos.addEventListener('click', alternarModo)
      btnSom.addEventListener('click', function () { liberarAudioIOS(); definirSom(!cfg.som) })
      if (suportaTelaCheia) {
        btnTelaCheia.addEventListener('click', alternarTelaCheia)
        document.addEventListener('fullscreenchange', atualizarBotaoTelaCheia)
        document.addEventListener('webkitfullscreenchange', atualizarBotaoTelaCheia)
      } else {
        btnTelaCheia.hidden = true
      }
      btnCopiar.addEventListener('click', copiarOrdem)
      // Stop: interrompe a sequência ou termina o giro na hora, na face já sorteada
      btnParar.addEventListener('click', function () {
        if (sequenciaAtiva) {
          encerrarSequencia(false)
        } else {
          if (segurando) finalizarSegurar()
          if (concluirGiroAtual) concluirGiroAtual()
        }
        atualizarTudo()
      })
      btnLimpar.addEventListener('click', function () {
        if (!historico.length || !emRepouso()) return
        limparHistorico()
        atualizarTudo()
      })

      // Gestos que destravam o AudioContext (o iOS aceita touchend/mousedown/keydown; não touchstart)
      ;['pointerdown', 'mousedown', 'touchend', 'pointerup', 'click', 'keydown'].forEach(function (tipo) {
        document.addEventListener(tipo, liberarAudioIOS, { capture: true, passive: true })
      })
      document.addEventListener('visibilitychange', function () {
        if (!ctxAudio) return
        if (document.hidden) {
          pararMusica()
          ctxAudio.suspend().catch(function () {})
        }
      })

      // ---------- Escala do palco (inalterado) ----------
      var palco = document.getElementById('palco')
      var STAGE_TOTAL = 490
      function ajustarEscalaPalco() {
        if (!palco) return
        var vv = window.visualViewport
        var viewW = vv && vv.width ? vv.width : window.innerWidth
        var viewH = vv && vv.height ? vv.height : window.innerHeight
        var ctaReserve = 82
        try {
          var raw = window.getComputedStyle(palco).getPropertyValue('--cta-reserve')
          if (raw) {
            var probe = document.createElement('div')
            probe.style.cssText = 'position:absolute;visibility:hidden;height:' + raw
            document.body.appendChild(probe)
            var resolved = probe.offsetHeight
            document.body.removeChild(probe)
            if (resolved > 0) ctaReserve = resolved
          }
        } catch (err) {}
        var availW = Math.max(200, viewW - 16)
        var availH = Math.max(200, viewH - ctaReserve - RESERVA_TOPO - 8)
        var scale = Math.min(1, availW / STAGE_TOTAL, availH / STAGE_TOTAL)
        scale = Math.max(0.42, Math.round(scale * 1000) / 1000)
        // Só transform: no WebKit/Safari, zoom num ancestral com preserve-3d calcula errado
        // os limites das camadas 3D e recorta as faces mais largas (com poucas faces)
        palco.style.transform = 'scale(' + scale + ')'
        palco.style.webkitTransform = 'scale(' + scale + ')'
        palco.style.transformOrigin = 'center center'
        palco.style.webkitTransformOrigin = 'center center'
        palco.setAttribute('data-scale', String(scale))
        centralizarFundo()
      }

      // Sombra e raios do fundo acompanham o centro e a escala reais da moldura
      var wrapperPiao = document.getElementById('wrapper')
      function centralizarFundo() {
        if (!wrapperPiao) return
        var r = wrapperPiao.getBoundingClientRect()
        if (!r.width) return
        var raiz = document.documentElement.style
        raiz.setProperty('--centro-x', (r.left + r.width / 2).toFixed(1) + 'px')
        raiz.setProperty('--centro-y', (r.top + r.height / 2).toFixed(1) + 'px')
        raiz.setProperty('--escala', (r.width / 400).toFixed(3))
      }

      var resizeTimer = null
      function agendarAjusteEscala() {
        if (resizeTimer) window.clearTimeout(resizeTimer)
        resizeTimer = window.setTimeout(ajustarEscalaPalco, 50)
      }
      window.addEventListener('resize', agendarAjusteEscala)
      window.addEventListener('orientationchange', function () {
        window.setTimeout(ajustarEscalaPalco, 120)
      })
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', agendarAjusteEscala)
        window.visualViewport.addEventListener('scroll', agendarAjusteEscala)
      }

      // ---------- Início ----------
      criarContextoAudio() // nasce suspenso; já baixa e decodifica a trilha
      construirPiao(cfg.faces)
      definirSom(cfg.som)
      atualizarBotaoTelaCheia()
      atualizarTudo()
      ajustarEscalaPalco()
      mostrarToast(telaDeToque ? 'Double-tap the top or drag it to spin' : 'Double-click the top or drag it to spin', null, null, 4000)
    })()
  </script>
</body>
</html>
