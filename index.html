  <meta charset="UTF-8" />

  <title>Pião — Sorteio de Apresentação</title>
  <style type="text/css" media="screen">

      --moldura-shadow: 0 0 28px 4px rgba(220, 15, 25, 0.35), 0 18px 48px rgba(0, 0, 0, 0.65), 0 4px 14px rgba(0, 0, 0, 0.4), inset 0 0 25px 8px rgba(0, 0, 0, 0.9), inset 0 3px 6px rgba(255, 255, 255, 0.4), inset 0 -3px 6px rgba(0, 0, 0, 0.45);

      --moldura-shadow: 0 0 28px 4px rgba(220, 15, 25, 0.35), 0 18px 48px rgba(0, 0, 0, 0.65), 0 4px 14px rgba(0, 0, 0, 0.4), inset 0 0 25px 8px rgba(0, 0, 0, 0.9), inset 0 3px 6px rgba(255, 255, 255, 0.4), inset 0 -3px 6px rgba(0, 0, 0, 0.45);
      --placa-shadow: 0 10px 22px rgba(0, 0, 0, 0.55), 0 3px 8px rgba(0, 0, 0, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.3), inset 0 -1px 2px rgba(0, 0, 0, 0.15);
      --scene-bg: radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.75) 205px, rgba(0, 0, 0, 0.42) 248px, rgba(0, 0, 0, 0.15) 290px, transparent 360px), radial-gradient(circle at 50% 20%, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.05) 50%, transparent 80%), radial-gradient(circle at 50% 50%, transparent 60%, rgba(0, 0, 0, 0.22) 100%), repeating-conic-gradient(from 0deg at 50% 50%, #e5eae1 0deg, #d6dcd2 3.2deg, #c5ccc1 6.8deg, #161914 6.8deg, #161914 7.5deg);
    }

    body[data-theme="auditorio"] {
      --bg-1: #e7e3d8;
      --bg-2: #bebbaf;
      --scene-glow: rgba(255,214,92,0.18);
      --panel-bg: rgba(255,255,255,0.96);
      --panel-border: rgba(0,0,0,0.08);
      --text-soft: #555;
      --metal: #d8d5ce;
      --metal-shadow: #8e8e8e;
      --face-1: #1e1f21;
      --face-2: #07090d;
      --face-text: #f7f7f7;
      --frame-red: #c90d1f;
      --frame-red-strong: #8a0812;
      --red-cta: #b80d18;
      --red-cta-2: #7a0610;
      --gold-1: #ffd84a;
      --gold-2: #d9ad12;
      --scene-1: #1a1815;
      --scene-2: #090909;
      --slot-1: #f5f1e4;
      --slot-2: #e7d9ab;
      --slot-3: #c5bca0;
      --slot-4: #201611;
      --piao-bg: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.04) 22%, rgba(0,0,0,0.12) 46%, rgba(0,0,0,0.8) 100%), linear-gradient(180deg, #1d1b19 0%, #090909 100%);
      --moldura-shadow: 0 0 28px 4px rgba(220, 15, 25, 0.38), 0 20px 60px rgba(0, 0, 0, 0.7), 0 4px 16px rgba(0, 0, 0, 0.45), inset 0 0 28px 10px rgba(0, 0, 0, 0.96), inset 0 5px 8px rgba(255, 255, 255, 0.3), inset 0 -4px 8px rgba(0, 0, 0, 0.5);
      --placa-shadow: 0 12px 26px rgba(0, 0, 0, 0.56), 0 4px 10px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255,255,255,0.35), inset 0 -1px 2px rgba(0,0,0,0.15);
      --scene-bg: radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.7) 180px, rgba(0, 0, 0, 0.46) 230px, rgba(0, 0, 0, 0.18) 280px, transparent 340px), radial-gradient(circle at 50% 18%, rgba(255, 236, 145, 0.3) 0%, rgba(255, 236, 145, 0.05) 42%, transparent 80%), radial-gradient(circle at 50% 50%, transparent 60%, rgba(0, 0, 0, 0.24) 100%), linear-gradient(180deg, rgba(255, 196, 0, 0.06), rgba(206, 13, 31, 0.08)), repeating-conic-gradient(from 0deg at 50% 50%, #f7f5ea 0deg, #ebe0b3 3.2deg, #d7caa4 6.8deg, #20150f 6.8deg, #20150f 7.5deg);
    }

    body[data-theme="neon"] {
      --bg-1: #0b1220;
      --bg-2: #171b2d;
      --scene-glow: rgba(56,191,255,0.22);
      --panel-bg: rgba(12,18,27,0.88);
      --panel-border: rgba(123, 231, 255, 0.24);
      --text-soft: #d7ecff;
      --metal: #9ad8ff;
      --metal-shadow: #4aa8d8;
      --face-1: #09131a;
      --face-2: #04070d;
      --face-text: #f4fbff;
      --frame-red: #ff2f7d;
      --frame-red-strong: #b41858;
      --red-cta: #ff3678;
      --red-cta-2: #c52b5d;
      --gold-1: #ffd84a;
      --gold-2: #f7a700;
      --scene-1: #101925;
      --scene-2: #050c19;
      --slot-1: #dff4ff;
      --slot-2: #68d3ff;
      --slot-3: #7a7ff5;
      --slot-4: #0b1020;
      --piao-bg: radial-gradient(circle at 50% 50%, rgba(0,255,255,0.28) 0%, rgba(48,96,255,0.08) 30%, rgba(0,0,0,0.7) 100%), linear-gradient(180deg, #0f1729 0%, #080b12 100%);
      --moldura-shadow: 0 0 34px 6px rgba(255, 47, 125, 0.44), 0 18px 52px rgba(5, 18, 33, 0.9), 0 4px 18px rgba(0, 0, 0, 0.5), inset 0 0 24px 8px rgba(0, 0, 0, 0.96), inset 0 4px 8px rgba(255,255,255,0.16), inset 0 -4px 8px rgba(0, 0, 0, 0.5);
      --placa-shadow: 0 12px 26px rgba(0, 0, 0, 0.6), 0 4px 12px rgba(0, 0, 0, 0.35), inset 0 1px 1px rgba(255,255,255,0.18), inset 0 -1px 2px rgba(0,0,0,0.12);
      --scene-bg: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.76) 180px, rgba(0,0,0,0.45) 230px, rgba(0,0,0,0.18) 280px, transparent 340px), radial-gradient(circle at 50% 18%, rgba(98,230,255,0.28) 0%, rgba(98,150,255,0.08) 40%, transparent 80%), radial-gradient(circle at 50% 50%, transparent 60%, rgba(0, 0, 0, 0.25) 100%), repeating-conic-gradient(from 0deg at 50% 50%, #dffcff 0deg, #81d5ff 3.2deg, #6685ff 6.8deg, #0c1731 6.8deg, #0c1731 7.5deg);
    }

    html {
      height: 100%;
      background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      position: relative;
      height: 100%;
      width: 100%;
      margin: 0;
      overflow: hidden;
      user-select: none;
      background: linear-gradient(180deg, rgba(0,0,0,0.06), rgba(0,0,0,0.18));
      color: #111;
    }

    #wrapper {
      width: 400px;
      height: 400px;
      position: absolute;
      left: 50%;
      top: 50%;
      margin-left: -200px;
      margin-top: -200px;
      -webkit-transform-style: preserve-3d;
      transform-style: preserve-3d;
    }

    #piao {
      position: relative;
      top: 65px;
      margin: 0 auto;
      height: 270px;
      width: 165px;
      -webkit-transform-style: preserve-3d;
      transform-style: preserve-3d;
      filter: drop-shadow(0 14px 18px rgba(0, 0, 0, 0.5));
    }

    #piao .numero {
      position: absolute;
      height: 100%;
      border: 5px solid var(--metal);
      border-radius: 8px;
      box-shadow:
        inset 0 0 0 1px var(--metal-shadow),
        inset 0 1px 2px rgba(255, 255, 255, 0.85),
        0 0 0 1px #3c4248,
        0 10px 18px rgba(0, 0, 0, 0.25);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 195px;
      line-height: 0.9;
      letter-spacing: -0.08em;
      white-space: nowrap;
      overflow: hidden;
      color: var(--face-text);
      text-shadow: 0 2px 0 rgba(0,0,0,0.8), 0 0 10px rgba(0,0,0,0.35);
      background: linear-gradient(145deg, var(--face-1) 0%, var(--face-2) 35%, #101114 100%);
      box-sizing: border-box;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      user-select: none;
      transition: color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    #piao .numero::before {
      content: "";
      position: absolute;
      inset: 8px 10px 10px 10px;
      border-radius: 6px;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.02), rgba(0,0,0,0.18));
      pointer-events: none;
    }

    #moldura {
      height: 400px;
      width: 400px;
      border: 45px solid var(--frame-red);
      border-radius: 50%;
      position: absolute;
      top: -45px;
      left: -45px;
      box-sizing: content-box;
      -webkit-transform: translateZ(400px);
      transform: translateZ(400px);
      box-shadow: var(--moldura-shadow);
    }

    .placa-premio {
      position: absolute;
      left: 50%;
      bottom: -68px;
      width: 122px;
      height: 72px;
      margin-left: -61px;
      -webkit-transform: translateZ(435px);
      transform: translateZ(435px);
      background: linear-gradient(180deg, var(--gold-1) 0%, var(--gold-2) 100%);
      border: 2px solid #222222;
      border-radius: 4px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px 6px;
      box-shadow: var(--placa-shadow);
      z-index: 10;
      user-select: none;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .placa-premio:hover {
      transform: translateZ(440px) scale(1.02);
      -webkit-transform: translateZ(440px) scale(1.02);
    }

    .placa-premio::after {
      content: '';
      position: absolute;
      bottom: -7px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 7px;
      background: #555555;
      border-radius: 0 0 2px 2px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }

    .placa-conteudo {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1;
      width: 100%;
    }

    .placa-numero {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 35px;
      font-weight: 900;
      color: #111111;
      line-height: 0.95;
      letter-spacing: -0.5px;
    }

    .placa-rotulo {
      font-family: 'Arial Black', 'Impact', sans-serif;
      font-size: 11px;
      font-weight: 900;
      color: #111111;
      letter-spacing: 0.5px;
      margin-top: 3px;
      text-transform: uppercase;
    }

    #piao-bg {
      height: 404px;
      width: 404px;
      border-radius: 50%;
      position: absolute;
      top: -2px;
      left: -2px;
      background: var(--piao-bg);
      box-shadow: inset 0 0 0 3px rgba(255,255,255,0.08), inset 0 -18px 20px rgba(0,0,0,0.45), 0 0 22px rgba(0,0,0,0.16);
      -webkit-transform: translateZ(1px);
      transform: translateZ(1px);
    }

    #decoracao {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
      background-color: var(--scene-1);
      background-image: var(--scene-bg);
    }

    .btn-expandir-drawer {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      width: 50px;
      height: 50px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--red-cta) 0%, var(--red-cta-2) 100%);
      border: 3px solid #ffd700;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(200, 0, 0, 0.45), 0 0 14px rgba(255, 215, 0, 0.4);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      user-select: none;
    }

    .btn-expandir-drawer .drawer-icone {
      font-size: 26px;
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.35));
      transition: transform 0.25s ease;
    }

    .btn-expandir-drawer:hover {
      background: linear-gradient(135deg, var(--red-cta) 0%, var(--red-cta-2) 100%);
      transform: scale(1.12);
      box-shadow: 0 8px 25px rgba(200, 0, 0, 0.6), 0 0 20px rgba(255, 215, 0, 0.7);
    }

    .btn-expandir-drawer:hover .drawer-icone {
      transform: rotate(45deg);
    }

    .btn-expandir-drawer:active {
      transform: scale(0.95);
    }

    #painel {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 90;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 16px 18px;
      border-radius: 14px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.18), 0 4px 12px rgba(0, 0, 0, 0.06);
      width: 250px;
      font-family: inherit;
      box-sizing: border-box;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    #painel .painel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
    }

    #painel .header-titulo {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #painel .header-titulo h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--red-cta);
    }

    #painel .header-acoes {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #painel .btn-reset-config {
      background: #f0f0f0;
      border: 1px solid #ccc;
      color: #555;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    #painel .btn-reset-config:hover {
      background: #e0e0e0;
      color: var(--red-cta);
      border-color: #bbb;
    }

    #painel .btn-som {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }

    #painel .btn-som.ativo {
      background: #e8f5e9;
      color: #2e7d32;
      border-color: #c8e6c9;
    }

    #painel .btn-som.ativo:hover {
      background: #c8e6c9;
    }

    #painel .btn-som.mudo {
      background: #ffebee;
      color: #c62828;
      border-color: #ffcdd2;
    }

    #painel .btn-som.mudo:hover {
      background: #ffcdd2;
    }

    #painel .btn-recolher {
      background: #eee;
      border: 1px solid #ccc;
      color: #444;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    #painel .btn-recolher:hover {
      background: #ddd;
      color: var(--red-cta);
    }

    #painel .painel-conteudo {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #painel .campo {
      margin: 0;
    }

    #painel .campo label {
      display: block;
      font-weight: 600;
      font-size: 11px;
      color: var(--text-soft);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .stepper-controle {
      display: flex;
      align-items: center;
      width: 100%;
      background: #f1f1f1;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #ddd;
    }

    .stepper-controle .btn-step {
      width: 44px;
      height: 36px;
      flex-shrink: 0;
      border: none;
      background: #e2e2e2;
      color: #333;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .stepper-controle .btn-step:hover:not(:disabled) {
      background: #d4d4d4;
      color: var(--red-cta);
    }

    .stepper-controle .btn-step:active:not(:disabled) {
      background: #c8c8c8;
    }

    .stepper-controle .btn-step:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .stepper-controle input {
      flex: 1;
      width: 100%;
      min-width: 0;
      border: none;
      background: transparent;
      text-align: center;
      font-size: 16px;
      font-weight: 800;
      color: #111;
      cursor: default;
      outline: none;
      user-select: none;
      -webkit-appearance: none;
      margin: 0;
    }

    .botoes-toggle,
    .botoes-vel {
      display: flex;
      gap: 3px;
      background: #f1f1f1;
      padding: 3px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .botoes-toggle .btn-toggle,
    .botoes-vel .btn-vel {
      flex: 1;
      padding: 6px 4px;
      font-size: 11px;
      font-weight: 700;
      border: none;
      background: transparent;
      color: #666;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .botoes-toggle .btn-toggle:hover:not(.ativo):not(:disabled),
    .botoes-vel .btn-vel:hover:not(.ativo):not(:disabled) {
      background: rgba(0, 0, 0, 0.05);
      color: #111;
    }

    .botoes-toggle .btn-toggle.ativo,
    .botoes-vel .btn-vel.ativo {
      background: var(--red-cta);
      color: white;
      box-shadow: 0 2px 4px rgba(200, 0, 0, 0.3);
    }

    .botoes-toggle .btn-toggle:disabled,
    .botoes-vel .btn-vel:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #girar {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: white;
      background: linear-gradient(135deg, var(--red-cta) 0%, var(--red-cta-2) 100%);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(200, 0, 0, 0.35);
      transition: all 0.15s ease;
      user-select: none;
    }

    #girar:hover:not(:disabled) {
      background: linear-gradient(135deg, rgb(235, 20, 20) 0%, rgb(180, 0, 0) 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(200, 0, 0, 0.45);
    }

    #girar:active:not(:disabled),
    #girar.segurando {
      background: linear-gradient(135deg, rgb(160, 0, 0) 0%, rgb(120, 0, 0) 100%);
      transform: translateY(1px);
      box-shadow: 0 2px 6px rgba(200, 0, 0, 0.3);
    }

    #girar.parar {
      background: linear-gradient(135deg, #d32f2f 0%, #b71c1c 100%);
      animation: pulsar-parar 1s infinite alternate ease-in-out;
    }

    @keyframes pulsar-parar {
      0% { filter: brightness(1); }
      100% { filter: brightness(1.2); }
    }

    .dica-espaco {
      font-size: 11px;
      color: #666;
      text-align: center;
      margin-top: 6px;
      line-height: 1.35;
    }

    #hud-sorteados {
      position: fixed;
      z-index: 80;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 0, 0, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
      font-family: inherit;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      user-select: none;
      transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
    }

    #hud-sorteados.pos-bottom {
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: min(85vw, 680px);
      max-height: 110px;
      border-radius: 16px;
      padding: 10px 16px;
    }

    #hud-sorteados.pos-right {
      top: 20px;
      bottom: 20px;
      right: 20px;
      width: 140px;
      border-radius: 16px;
      padding: 14px 10px;
      transform: none;
      left: auto;
      max-height: none;
    }

    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .hud-titulo {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--red-cta);
    }

    .hud-contador {
      background: #f1f1f1;
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 10px;
      color: #555;
    }

    .hud-acoes {
      display: flex;
      gap: 6px;
    }

    .btn-posicao-hud,
    .btn-limpar-hud {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #f5f5f5;
      color: #444;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-posicao-hud:hover,
    .btn-limpar-hud:hover {
      background: #e8e8e8;
      color: var(--red-cta);
      border-color: #bbb;
    }

    .lista-sorteados {
      display: flex;
      gap: 8px;
      overflow: auto;
      flex: 1;
      align-items: center;
    }

    #hud-sorteados.pos-bottom .lista-sorteados {
      flex-direction: row;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 2px;
    }

    #hud-sorteados.pos-right .lista-sorteados {
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      align-items: stretch;
      padding-right: 2px;
    }

    .badge-sorteado {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #111;
      color: #fff;
      padding: 6px 12px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 14px;
      border: 2px solid #333;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      flex-shrink: 0;
      animation: badge-surgir 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #hud-sorteados.pos-right .badge-sorteado {
      width: 100%;
      box-sizing: border-box;
      justify-content: space-between;
      padding: 8px 10px;
    }

    .badge-sorteado .ordem-sorteado {
      font-size: 11px;
      color: #bbb;
      font-weight: 600;
    }

    .badge-sorteado .numero-sorteado {
      font-size: 18px;
      color: #ffd700;
      font-family: 'Impact', 'Arial Black', sans-serif;
      letter-spacing: 0.5px;
    }

    .badge-sorteado.recente {
      border-color: #ffd700;
      box-shadow: 0 0 16px rgba(255, 215, 0, 0.8);
      background: linear-gradient(135deg, #1a0000 0%, #300000 100%);
    }

    @keyframes badge-surgir {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 768px) {
      #wrapper {
        transform: scale(0.75);
      }
      #hud-sorteados.pos-bottom {
        width: 92vw;
      }
    }
  </style>
</head>
<body data-theme="classic">
  <button type="button" id="btn-expandir-drawer" class="btn-expandir-drawer" style="display:none;" title="Abrir painel de controles" aria-label="Abrir painel de controles">
    <span class="drawer-icone">⚙️</span>
  </button>

  <aside id="painel">
    <div class="painel-header">
      <div class="header-titulo">
        <span style="font-size: 16px;">🎯</span>
        <h1>Sorteio</h1>
      </div>
      <div class="header-acoes">
        <button type="button" id="btn-reset-config" class="btn-reset-config" title="Resetar todas as configurações para o padrão">Reset</button>
        <button type="button" id="toggle-som" class="btn-som ativo" title="Ligar/Desligar som do Pião">🔊 Som Ligado</button>
        <button type="button" id="btn-recolher" class="btn-recolher" title="Recolher painel">✕</button>
      </div>
    </div>

    <div class="painel-conteudo">
      <div class="campo">
        <label>Tema visual</label>
        <div class="botoes-toggle" id="botoes-tema">
          <button type="button" class="btn-toggle ativo" data-theme="classic">Clássico</button>
          <button type="button" class="btn-toggle" data-theme="auditorio">Auditório</button>
          <button type="button" class="btn-toggle" data-theme="neon">Neon</button>
        </div>
      </div>

      <div class="campo">
        <label>Modo de sorteio</label>
        <div class="botoes-toggle" id="botoes-modo">
          <button type="button" class="btn-toggle ativo" data-modo="numeros">1 2 3 Números</button>
          <button type="button" class="btn-toggle" data-modo="letras">A B C Letras</button>
        </div>
      </div>

      <div class="campo">
        <label for="integrantes-input">Faces (2 a 15)</label>
        <div class="stepper-controle">
          <button type="button" id="btn-menos-faces" class="btn-step" aria-label="Diminuir faces">−</button>
          <input type="number" id="integrantes-input" min="2" max="15" value="6" readonly />
          <button type="button" id="btn-mais-faces" class="btn-step" aria-label="Aumentar faces">+</button>
        </div>
      </div>

      <div class="campo">
        <label for="qtd-sorteios">Sorteios em sequência</label>
        <div class="stepper-controle">
          <button type="button" id="btn-menos-sorteios" class="btn-step" aria-label="Diminuir sorteios">−</button>
          <input type="number" id="qtd-sorteios" min="1" max="50" value="1" readonly />
          <button type="button" id="btn-mais-sorteios" class="btn-step" aria-label="Aumentar sorteios">+</button>
        </div>
      </div>

      <div class="campo">
        <label>Repetir sorteados</label>
        <div class="botoes-toggle" id="botoes-repeticao">
          <button type="button" class="btn-toggle ativo" data-repetir="nao">Não</button>
          <button type="button" class="btn-toggle" data-repetir="sim">Sim</button>
        </div>
      </div>

      <div class="campo">
        <label>Velocidade</label>
        <div class="botoes-vel" id="botoes-vel">
          <button type="button" class="btn-vel ativo" data-vel="1">1x</button>
          <button type="button" class="btn-vel" data-vel="2">2x</button>
        </div>
      </div>

      <div class="campo">
        <label>Placa de Prêmio</label>
        <div style="display: flex; gap: 6px; align-items: center;">
          <input type="text" id="input-placa-valor" value="50" maxlength="6" style="width: 54px; text-align: center; font-weight: 800; font-family: Impact, sans-serif; font-size: 15px; padding: 6px 4px; border: 1px solid #ddd; border-radius: 6px;" />
          <input type="text" id="input-placa-rotulo" value="MIL REAIS" maxlength="15" style="flex: 1; font-weight: 700; font-size: 11px; padding: 7px 6px; border: 1px solid #ddd; border-radius: 6px;" />
          <button type="button" id="btn-toggle-placa" class="btn-toggle ativo" style="padding: 6px 8px; font-size: 11px; font-weight: 700; border-radius: 6px; cursor: pointer;" title="Mostrar ou ocultar a placa de prêmio">On</button>
        </div>
      </div>

      <div class="campo campo-acao">
        <button type="button" id="girar">Girar Pião [Espaço]</button>
        <div class="dica-espaco" id="dica-espaco">💡 Segure <strong>[Espaço]</strong> para girar e solte para sortear!</div>
      </div>
    </div>
  </aside>

  <section id="hud-sorteados" class="pos-bottom" style="display:none;" title="Clique no painel para mudar de posição (Inferior / Lateral)">
    <div class="hud-header">
      <div class="hud-titulo">
        <span>🏆</span>
        <span>Sorteados</span>
        <span id="hud-contador" class="hud-contador">0</span>
      </div>
      <div class="hud-acoes">
        <button type="button" id="btn-posicao-hud" class="btn-posicao-hud" title="Mover painel para a lateral direita (vertical) ou inferior (horizontal)">➡️ Lateral</button>
        <button type="button" id="limpar-historico" class="btn-limpar-hud" title="Limpar histórico">Limpar</button>
      </div>
    </div>
    <div id="lista-sorteados" class="lista-sorteados"></div>
  </section>

  <div id="wrapper">
    <div id="piao"></div>
    <div id="moldura"></div>
    <div id="piao-bg"></div>
    <div id="placa-premio" class="placa-premio" title="Placa clássica de prêmio do Pião da Casa Própria (50 MIL REAIS)">
      <div class="placa-conteudo">
        <span class="placa-numero" id="placa-numero-texto">50</span>
        <span class="placa-rotulo" id="placa-rotulo-texto">MIL REAIS</span>
      </div>
    </div>
  </div>

  <audio preload="auto" loop="true">
    <source src="piao-da-casa-propria-soundtrack.mp3" />
    <source src="piao-da-casa-propria-soundtrack.m4a" />
    <source src="piao-da-casa-propria-soundtrack.ogg" />
  </audio>

  <div id="decoracao"></div>

  <script type="text/javascript">
    (function () {
      var spinStyleEl = document.getElementById('spin-keyframes')
      if (!spinStyleEl) {
        spinStyleEl = document.createElement('style')
        spinStyleEl.id = 'spin-keyframes'
        document.head.appendChild(spinStyleEl)
      }

      var piao = document.querySelector('#piao')
      var painel = document.querySelector('#painel')
      var btnExpandirDrawer = document.querySelector('#btn-expandir-drawer')
      var btnRecolher = document.querySelector('#btn-recolher')
      var btnResetConfig = document.querySelector('#btn-reset-config')

      var botoesTema = document.querySelectorAll('#botoes-tema .btn-toggle')
      var temaAtual = 'classic'

      var botoesModo = document.querySelectorAll('#botoes-modo .btn-toggle')
      var modoSorteio = 'numeros'

      var btnMenosFaces = document.querySelector('#btn-menos-faces')
      var btnMaisFaces = document.querySelector('#btn-mais-faces')
      var integrantesInput = document.querySelector('#integrantes-input')

      var btnMenosSorteios = document.querySelector('#btn-menos-sorteios')
      var btnMaisSorteios = document.querySelector('#btn-mais-sorteios')
      var qtdSorteiosInput = document.querySelector('#qtd-sorteios')

      var velButtons = document.querySelectorAll('.btn-vel')
      var botoesRepeticao = document.querySelectorAll('#botoes-repeticao .btn-toggle')
      var permitirRepeticao = false
      var velMultiplicador = 1

      var girarBtn = document.querySelector('#girar')
      var dicaEspaco = document.querySelector('#dica-espaco')

      var hudSorteados = document.querySelector('#hud-sorteados')
      var hudContador = document.querySelector('#hud-contador')
      var listaSorteados = document.querySelector('#lista-sorteados')
      var btnPosicaoHud = document.querySelector('#btn-posicao-hud')
      var limparHistoricoBtn = document.querySelector('#limpar-historico')
      var totalSorteadosCont = 0
      var hudPosicao = 'bottom'

      var audio = document.querySelector('audio')
      var toggleSomBtn = document.querySelector('#toggle-som')
      var somHabilitado = true

      var girando = false
      var segurandoEspaco = false
      var sequenciaAtiva = false
      var anguloAcumulado = 0
      var tempoInicioEspaco = 0
      var RAIO_CILINDRO = 165

      function clampIntegrantes(n) {
        return Math.min(15, Math.max(2, Math.round(n)))
      }

      function clampQtdSorteios(q) {
        return Math.min(50, Math.max(1, Math.round(q)))
      }

      function obterRotuloFace(numIndex) {
        if (modoSorteio === 'letras') {
          return String.fromCharCode(64 + numIndex)
        }
        return String(numIndex)
      }

      function calcularFontSize(n, width, numero) {
        var rotulo = String(obterRotuloFace(numero))
        var numCaracteres = rotulo.length
        var base = 195
        var reducao = Math.max(0, numCaracteres - 1) * 26
        var fontSize = base - reducao

        if (modoSorteio === 'letras') {
          fontSize *= 0.9
        }

        return Math.min(195, Math.max(32, Math.round(fontSize)))
      }

      function limparDestaque() {
        var faces = piao.querySelectorAll('.numero')
        for (var i = 0; i < faces.length; i++) {
          faces[i].classList.remove('vencedor')
        }
      }

      function destacarVencedor(winnerFaceEl) {
        if (!winnerFaceEl) return
        winnerFaceEl.classList.add('vencedor')
      }

      function aplicarTema(tema) {
        temaAtual = tema
        document.body.setAttribute('data-theme', tema)
        botoesTema.forEach(function (botao) {
          botao.classList.toggle('ativo', botao.dataset.theme === tema)
        })
      }

      function atualizarBotoesModo() {
        botoesModo.forEach(function (botao) {
          var ativo = botao.dataset.modo === modoSorteio
          botao.classList.toggle('ativo', ativo)
        })
      }

      function atualizarBotoesRepeticao() {
        botoesRepeticao.forEach(function (botao) {
          var ativo = botao.dataset.repetir === (permitirRepeticao ? 'sim' : 'nao')
          botao.classList.toggle('ativo', ativo)
        })
      }

      function atualizarBotoesVel() {
        velButtons.forEach(function (botao) {
          var ativo = Number(botao.dataset.vel) === velMultiplicador
          botao.classList.toggle('ativo', ativo)
        })
      }

      function definirPosicaoHud(pos) {
        hudPosicao = pos
        if (pos === 'right') {
          hudSorteados.classList.remove('pos-bottom')
          hudSorteados.classList.add('pos-right')
          if (btnPosicaoHud) {
            btnPosicaoHud.textContent = '⬇️ Base'
            btnPosicaoHud.title = 'Mover painel para a base da tela (horizontal)'
          }
          hudSorteados.title = 'Clique no painel para mover para a base da tela (horizontal)'
        } else {
          hudSorteados.classList.remove('pos-right')
          hudSorteados.classList.add('pos-bottom')
          if (btnPosicaoHud) {
            btnPosicaoHud.textContent = '➡️ Lateral'
            btnPosicaoHud.title = 'Mover painel para a lateral direita (vertical)'
          }
          hudSorteados.title = 'Clique no painel para mover para a lateral direita (vertical)'
        }
      }

      function removerSorteados() {
        while (listaSorteados.firstChild) {
          listaSorteados.removeChild(listaSorteados.firstChild)
        }
        totalSorteadosCont = 0
        hudContador.textContent = String(totalSorteadosCont)
      }

      function adicionarBadgeSorteado(item, rec) {
        var badge = document.createElement('div')
        badge.className = 'badge-sorteado' + (rec ? ' recente' : '')

        var ordem = document.createElement('span')
        ordem.className = 'ordem-sorteado'
        ordem.textContent = String(totalSorteadosCont + 1)

        var numero = document.createElement('span')
        numero.className = 'numero-sorteado'
        numero.textContent = String(item)

        badge.appendChild(ordem)
        badge.appendChild(numero)
        listaSorteados.appendChild(badge)
      }

      function atualizarHudHistorico() {
        hudContador.textContent = String(totalSorteadosCont)
      }

      function atualizarFacesDoPiao() {
        var totalFaces = clampIntegrantes(Number(integrantesInput.value) || 6)
        var anguloPorFace = 360 / totalFaces
        var raio = RAIO_CILINDRO
        var larguraFace = 165
        var alturaFace = 270

        piao.innerHTML = ''

        for (var i = 0; i < totalFaces; i++) {
          var face = document.createElement('div')
          face.className = 'numero'
          face.style.width = larguraFace + 'px'
          face.style.height = alturaFace + 'px'
          face.style.transform = 'rotateY(' + (i * anguloPorFace) + 'deg) translateZ(' + raio + 'px)'
          face.style.fontSize = calcularFontSize(totalFaces, larguraFace, i + 1) + 'px'
          face.textContent = obterRotuloFace(i + 1)
          piao.appendChild(face)
        }
      }

      function aplicarConfigPadrao() {
        modoSorteio = 'numeros'
        permitirRepeticao = false
        velMultiplicador = 1
        integrantesInput.value = '6'
        qtdSorteiosInput.value = '1'
        atualizarBotoesModo()
        atualizarBotoesRepeticao()
        atualizarBotoesVel()
        atualizarFacesDoPiao()
      }

      function resetarConfiguracoes() {
        aplicarConfigPadrao()
      }

      function selecionarFaceFinal() {
        var faces = piao.querySelectorAll('.numero')
        var faceFinal = null
        var menorTraslacao = Infinity

        for (var i = 0; i < faces.length; i++) {
          var face = faces[i]
          var transform = face.style.transform
          var match = transform.match(/translateZ\(([-\d.]+)px\)/)
          var z = match ? parseFloat(match[1]) : 0
          var ang = face.style.transform.match(/rotateY\(([-\d.]+)deg\)/)
          var angle = ang ? parseFloat(ang[1]) : 0
          var distancia = Math.abs(((angle % 360) + 360) % 360)

          if (distancia < menorTraslacao) {
            menorTraslacao = distancia
            faceFinal = face
          }
        }

        return faceFinal
      }

      botoesTema.forEach(function (botao) {
        botao.addEventListener('click', function () {
          aplicarTema(botao.dataset.theme)
        })
      })

      btnMaisFaces.addEventListener('click', function () {
        integrantesInput.value = String(clampIntegrantes(Number(integrantesInput.value) + 1))
        atualizarFacesDoPiao()
      })

      btnMenosFaces.addEventListener('click', function () {
        integrantesInput.value = String(clampIntegrantes(Number(integrantesInput.value) - 1))
        atualizarFacesDoPiao()
      })

      btnMaisSorteios.addEventListener('click', function () {
        qtdSorteiosInput.value = String(clampQtdSorteios(Number(qtdSorteiosInput.value) + 1))
      })

      btnMenosSorteios.addEventListener('click', function () {
        qtdSorteiosInput.value = String(clampQtdSorteios(Number(qtdSorteiosInput.value) - 1))
      })

      botoesModo.forEach(function (botao) {
        botao.addEventListener('click', function () {
          modoSorteio = botao.dataset.modo
          atualizarBotoesModo()
          atualizarFacesDoPiao()
        })
      })

      botoesRepeticao.forEach(function (botao) {
        botao.addEventListener('click', function () {
          permitirRepeticao = botao.dataset.repetir === 'sim'
          atualizarBotoesRepeticao()
        })
      })

      velButtons.forEach(function (botao) {
        botao.addEventListener('click', function () {
          velMultiplicador = Number(botao.dataset.vel)
          atualizarBotoesVel()
        })
      })

      btnResetConfig.addEventListener('click', resetarConfiguracoes)

      if (btnRecolher) {
        btnRecolher.addEventListener('click', function () {
          painel.style.display = 'none'
          btnExpandirDrawer.style.display = 'flex'
        })
      }

      if (btnExpandirDrawer) {
        btnExpandirDrawer.addEventListener('click', function () {
          painel.style.display = 'block'
          btnExpandirDrawer.style.display = 'none'
        })
      }

      limparHistoricoBtn.addEventListener('click', removerSorteados)
      btnPosicaoHud.addEventListener('click', function () {
        definirPosicaoHud(hudPosicao === 'bottom' ? 'right' : 'bottom')
      })

      aplicarTema('classic')
      atualizarFacesDoPiao()
      atualizarBotoesModo()
      atualizarBotoesRepeticao()
      atualizarBotoesVel()
      definirPosicaoHud('bottom')
    })()
  </script>
</body>
</html>
