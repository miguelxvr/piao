<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Pião — Sorteio de Apresentação</title>
  <style type="text/css" media="screen">
    :root {
      --bg-1: #f1f1ef;
      --bg-2: #d1d0cb;
      --panel-bg: rgba(255,255,255,0.96);
      --panel-border: rgba(0,0,0,0.08);
      --text-soft: #555;
      --metal: #d0d7de;
      --metal-shadow: #727a84;
      --face-1: #0d0d0f;
      --face-2: #050505;
      --face-text: #ffffff;
      --frame-red: #d80f24;
      --red-cta: rgb(200,0,0);
      --red-cta-2: rgb(160,0,0);
      --scene-1: #1a1d18;
      --piao-bg: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0.04) 22%, rgba(0,0,0,0.12) 46%, rgba(0,0,0,0.8) 100%), linear-gradient(180deg, #1d1d1b 0%, #090909 100%);
      --moldura-shadow: 0 0 28px 4px rgba(220, 15, 25, 0.35), 0 18px 48px rgba(0, 0, 0, 0.65), 0 4px 14px rgba(0, 0, 0, 0.4), inset 0 0 25px 8px rgba(0, 0, 0, 0.9), inset 0 3px 6px rgba(255, 255, 255, 0.4), inset 0 -3px 6px rgba(0, 0, 0, 0.45);
      --scene-bg: radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.75) 205px, rgba(0, 0, 0, 0.42) 248px, rgba(0, 0, 0, 0.15) 290px, transparent 360px), radial-gradient(circle at 50% 20%, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.05) 50%, transparent 80%), radial-gradient(circle at 50% 50%, transparent 60%, rgba(0, 0, 0, 0.22) 100%), repeating-conic-gradient(from 0deg at 50% 50%, #e5eae1 0deg, #d6dcd2 3.2deg, #c5ccc1 6.8deg, #161914 6.8deg, #161914 7.5deg);
    }

    html {
      height: 100%;
      background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      position: relative;
      height: 100%;
      width: 100%;
      margin: 0;
      overflow: hidden;
      user-select: none;
      background: linear-gradient(180deg, rgba(0,0,0,0.06), rgba(0,0,0,0.18));
      color: #111;
    }

    #palco {
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      bottom: calc(108px + env(safe-area-inset-bottom, 0px));
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
      pointer-events: none;
      z-index: 1;
    }

    #wrapper {
      width: 400px;
      height: 400px;
      position: relative;
      left: auto;
      top: auto;
      margin: 0;
      flex: 0 0 auto;
      -webkit-transform-style: preserve-3d;
      transform-style: preserve-3d;
      pointer-events: none;
    }

    #piao {
      position: relative;
      top: 65px;
      margin: 0 auto;
      height: 270px;
      width: 165px;
      -webkit-transform-style: preserve-3d;
      transform-style: preserve-3d;
    }

    #piao .numero {
      position: absolute;
      height: 100%;
      border: 5px solid var(--metal);
      border-radius: 8px;
      box-shadow:
        inset 0 0 0 1px var(--metal-shadow),
        inset 0 1px 2px rgba(255, 255, 255, 0.85),
        0 0 0 1px #3c4248,
        0 10px 18px rgba(0, 0, 0, 0.25);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 195px;
      line-height: 0.9;
      letter-spacing: -0.08em;
      white-space: nowrap;
      overflow: hidden;
      color: var(--face-text);
      text-shadow: 0 2px 0 rgba(0,0,0,0.8), 0 0 10px rgba(0,0,0,0.35);
      background: linear-gradient(145deg, var(--face-1) 0%, var(--face-2) 35%, #101114 100%);
      box-sizing: border-box;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      user-select: none;
      transition: color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    #piao .numero::before {
      content: "";
      position: absolute;
      inset: 8px 10px 10px 10px;
      border-radius: 6px;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.02), rgba(0,0,0,0.18));
      pointer-events: none;
    }

    #moldura {
      height: 400px;
      width: 400px;
      border: 45px solid var(--frame-red);
      border-radius: 50%;
      position: absolute;
      top: -45px;
      left: -45px;
      box-sizing: content-box;
      /* Z moderado: valores altos (ex.: 400) estouram o clipping do WebKit/iOS */
      -webkit-transform: translateZ(180px);
      transform: translateZ(180px);
      box-shadow: var(--moldura-shadow);
    }

    #piao-bg {
      height: 404px;
      width: 404px;
      border-radius: 50%;
      position: absolute;
      top: -2px;
      left: -2px;
      background: var(--piao-bg);
      box-shadow: inset 0 0 0 3px rgba(255,255,255,0.08), inset 0 -18px 20px rgba(0,0,0,0.45), 0 0 22px rgba(0,0,0,0.16);
      -webkit-transform: translateZ(1px);
      transform: translateZ(1px);
    }

    #decoracao {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
      background-color: var(--scene-1);
      background-image: var(--scene-bg);
    }

    .btn-expandir-drawer {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      width: 50px;
      height: 50px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--red-cta) 0%, var(--red-cta-2) 100%);
      border: 3px solid #ffd700;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(200, 0, 0, 0.45), 0 0 14px rgba(255, 215, 0, 0.4);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      user-select: none;
    }

    .btn-expandir-drawer .drawer-icone {
      font-size: 26px;
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.35));
      transition: transform 0.25s ease;
    }

    .btn-expandir-drawer:hover {
      background: linear-gradient(135deg, var(--red-cta) 0%, var(--red-cta-2) 100%);
      transform: scale(1.12);
      box-shadow: 0 8px 25px rgba(200, 0, 0, 0.6), 0 0 20px rgba(255, 215, 0, 0.7);
    }

    .btn-expandir-drawer:hover .drawer-icone {
      transform: rotate(45deg);
    }

    .btn-expandir-drawer:active {
      transform: scale(0.95);
    }

    #painel {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 90;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 16px 18px;
      border-radius: 14px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.18), 0 4px 12px rgba(0, 0, 0, 0.06);
      width: 250px;
      font-family: inherit;
      box-sizing: border-box;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    #painel .painel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
    }

    #painel .header-titulo {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #painel .header-titulo h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--red-cta);
    }

    #painel .header-acoes {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #painel .btn-reset-config {
      background: #f0f0f0;
      border: 1px solid #ccc;
      color: #555;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    #painel .btn-reset-config:hover {
      background: #e0e0e0;
      color: var(--red-cta);
      border-color: #bbb;
    }

    #painel .btn-som {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }

    #painel .btn-som.ativo {
      background: #e8f5e9;
      color: #2e7d32;
      border-color: #c8e6c9;
    }

    #painel .btn-som.ativo:hover {
      background: #c8e6c9;
    }

    #painel .btn-som.mudo {
      background: #ffebee;
      color: #c62828;
      border-color: #ffcdd2;
    }

    #painel .btn-som.mudo:hover {
      background: #ffcdd2;
    }

    #painel .btn-recolher {
      background: #eee;
      border: 1px solid #ccc;
      color: #444;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    #painel .btn-recolher:hover {
      background: #ddd;
      color: var(--red-cta);
    }

    #painel .painel-conteudo {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #painel .campo {
      margin: 0;
    }

    #painel .campo label {
      display: block;
      font-weight: 600;
      font-size: 11px;
      color: var(--text-soft);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .stepper-controle {
      display: flex;
      align-items: center;
      width: 100%;
      background: #f1f1f1;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #ddd;
    }

    .stepper-controle .btn-step {
      width: 44px;
      height: 36px;
      flex-shrink: 0;
      border: none;
      background: #e2e2e2;
      color: #333;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .stepper-controle .btn-step:hover:not(:disabled) {
      background: #d4d4d4;
      color: var(--red-cta);
    }

    .stepper-controle .btn-step:active:not(:disabled) {
      background: #c8c8c8;
    }

    .stepper-controle .btn-step:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .stepper-controle input {
      flex: 1;
      width: 100%;
      min-width: 0;
      border: none;
      background: transparent;
      text-align: center;
      font-size: 16px;
      font-weight: 800;
      color: #111;
      cursor: default;
      outline: none;
      user-select: none;
      -webkit-appearance: none;
      margin: 0;
    }

    .botoes-toggle {
      display: flex;
      gap: 3px;
      background: #f1f1f1;
      padding: 3px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .botoes-toggle .btn-toggle {
      flex: 1;
      padding: 6px 4px;
      font-size: 11px;
      font-weight: 700;
      border: none;
      background: transparent;
      color: #666;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .botoes-toggle .btn-toggle:hover:not(.ativo):not(:disabled) {
      background: rgba(0, 0, 0, 0.05);
      color: #111;
    }

    .botoes-toggle .btn-toggle.ativo {
      background: var(--red-cta);
      color: white;
      box-shadow: 0 2px 4px rgba(200, 0, 0, 0.3);
    }

    .botoes-toggle .btn-toggle:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #acao-principal {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      z-index: 85;
      width: min(92vw, 360px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    #acao-principal #girar,
    #acao-principal .dica-espaco {
      pointer-events: auto;
    }

    #girar {
      width: 100%;
      padding: 16px 18px;
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: white;
      background: linear-gradient(135deg, var(--red-cta) 0%, var(--red-cta-2) 100%);
      border: 2px solid #ffd700;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(200, 0, 0, 0.4), 0 0 18px rgba(255, 215, 0, 0.25);
      transition: all 0.15s ease;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #girar:hover:not(:disabled) {
      background: linear-gradient(135deg, rgb(235, 20, 20) 0%, rgb(180, 0, 0) 100%);
      transform: translateY(-1px);
      box-shadow: 0 10px 28px rgba(200, 0, 0, 0.5), 0 0 22px rgba(255, 215, 0, 0.35);
    }

    #girar:active:not(:disabled),
    #girar.segurando {
      background: linear-gradient(135deg, rgb(160, 0, 0) 0%, rgb(120, 0, 0) 100%);
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 3px 10px rgba(200, 0, 0, 0.35);
    }

    #girar.parar {
      background: linear-gradient(135deg, #d32f2f 0%, #b71c1c 100%);
      animation: pulsar-parar 1s infinite alternate ease-in-out;
    }

    @keyframes pulsar-parar {
      0% { filter: brightness(1); }
      100% { filter: brightness(1.2); }
    }

    .dica-espaco {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.92);
      text-align: center;
      line-height: 1.35;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75);
      max-width: 100%;
    }

    #hud-sorteados {
      position: fixed;
      z-index: 80;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 0, 0, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
      font-family: inherit;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      user-select: none;
      transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
    }

    #hud-sorteados.pos-bottom {
      bottom: calc(96px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      width: min(85vw, 680px);
      max-height: 110px;
      border-radius: 16px;
      padding: 10px 16px;
    }

    #hud-sorteados.pos-right {
      top: 20px;
      bottom: 20px;
      right: 20px;
      width: 140px;
      border-radius: 16px;
      padding: 14px 10px;
      transform: none;
      left: auto;
      max-height: none;
    }

    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .hud-titulo {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--red-cta);
    }

    .hud-contador {
      background: #f1f1f1;
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 10px;
      color: #555;
    }

    .hud-acoes {
      display: flex;
      gap: 6px;
    }

    .btn-posicao-hud,
    .btn-limpar-hud {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #f5f5f5;
      color: #444;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-posicao-hud:hover,
    .btn-limpar-hud:hover {
      background: #e8e8e8;
      color: var(--red-cta);
      border-color: #bbb;
    }

    .lista-sorteados {
      display: flex;
      gap: 8px;
      overflow: auto;
      flex: 1;
      align-items: center;
    }

    #hud-sorteados.pos-bottom .lista-sorteados {
      flex-direction: row;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 2px;
    }

    #hud-sorteados.pos-right .lista-sorteados {
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      align-items: stretch;
      padding-right: 2px;
    }

    .badge-sorteado {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #111;
      color: #fff;
      padding: 6px 12px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 14px;
      border: 2px solid #333;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      flex-shrink: 0;
      animation: badge-surgir 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #hud-sorteados.pos-right .badge-sorteado {
      width: 100%;
      box-sizing: border-box;
      justify-content: space-between;
      padding: 8px 10px;
    }

    .badge-sorteado .ordem-sorteado {
      font-size: 11px;
      color: #bbb;
      font-weight: 600;
    }

    .badge-sorteado .numero-sorteado {
      font-size: 18px;
      color: #ffd700;
      font-family: 'Impact', 'Arial Black', sans-serif;
      letter-spacing: 0.5px;
    }

    .badge-sorteado.recente {
      border-color: #ffd700;
      box-shadow: 0 0 16px rgba(255, 215, 0, 0.8);
      background: linear-gradient(135deg, #1a0000 0%, #300000 100%);
    }

    @keyframes badge-surgir {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 768px) {
      /* Nunca usar transform: scale no #wrapper — isso achata o 3D no iOS/Chrome */
      #palco {
        bottom: calc(118px + env(safe-area-inset-bottom, 0px));
        zoom: 0.72;
      }
      #acao-principal {
        width: min(94vw, 360px);
      }
      #girar {
        padding: 15px 16px;
        font-size: 15px;
      }
      #hud-sorteados.pos-bottom {
        width: 92vw;
        bottom: calc(104px + env(safe-area-inset-bottom, 0px));
      }
    }

    @media (max-width: 380px) {
      #palco {
        zoom: 0.64;
      }
    }
  </style>
</head>
<body>
  <button type="button" id="btn-expandir-drawer" class="btn-expandir-drawer" style="display:flex;" title="Abrir painel de controles" aria-label="Abrir painel de controles">
    <span class="drawer-icone">⚙️</span>
  </button>

  <aside id="painel" style="display:none;">
    <div class="painel-header">
      <div class="header-titulo">
        <span style="font-size: 16px;">🎯</span>
        <h1>Sorteio</h1>
      </div>
      <div class="header-acoes">
        <button type="button" id="btn-reset-config" class="btn-reset-config" title="Resetar todas as configurações para o padrão">Reset</button>
        <button type="button" id="toggle-som" class="btn-som ativo" title="Ligar/Desligar som do Pião">🔊 Som Ligado</button>
        <button type="button" id="btn-recolher" class="btn-recolher" title="Recolher painel">✕</button>
      </div>
    </div>

    <div class="painel-conteudo">
      <div class="campo">
        <label>Modo de sorteio</label>
        <div class="botoes-toggle" id="botoes-modo">
          <button type="button" class="btn-toggle ativo" data-modo="numeros">1 2 3 Números</button>
          <button type="button" class="btn-toggle" data-modo="letras">A B C Letras</button>
        </div>
      </div>

      <div class="campo">
        <label for="integrantes-input">Faces (2 a 15)</label>
        <div class="stepper-controle">
          <button type="button" id="btn-menos-faces" class="btn-step" aria-label="Diminuir faces">−</button>
          <input type="number" id="integrantes-input" min="2" max="15" value="6" readonly />
          <button type="button" id="btn-mais-faces" class="btn-step" aria-label="Aumentar faces">+</button>
        </div>
      </div>

      <div class="campo">
        <label>Sorteios em sequência</label>
        <div class="botoes-toggle" id="botoes-sequencia">
          <button type="button" class="btn-toggle ativo" data-sequencia="nao">Não</button>
          <button type="button" class="btn-toggle" data-sequencia="sim">Sim</button>
        </div>
      </div>

      <div class="campo">
        <label>Repetir sorteados</label>
        <div class="botoes-toggle" id="botoes-repeticao">
          <button type="button" class="btn-toggle ativo" data-repetir="nao">Não</button>
          <button type="button" class="btn-toggle" data-repetir="sim">Sim</button>
        </div>
      </div>
    </div>
  </aside>

  <div id="acao-principal">
    <button type="button" id="girar">Girar Pião</button>
    <div class="dica-espaco" id="dica-espaco">💡 Segure o botão para girar e solte para sortear</div>
  </div>

  <section id="hud-sorteados" class="pos-bottom" style="display:none;" title="Toque no painel para mudar de posição (Inferior / Lateral)">
    <div class="hud-header">
      <div class="hud-titulo">
        <span>🏆</span>
        <span>Sorteados</span>
        <span id="hud-contador" class="hud-contador">0</span>
      </div>
      <div class="hud-acoes">
        <button type="button" id="btn-posicao-hud" class="btn-posicao-hud" title="Mover painel para a lateral direita (vertical) ou inferior (horizontal)">➡️ Lateral</button>
        <button type="button" id="limpar-historico" class="btn-limpar-hud" title="Limpar histórico">Limpar</button>
      </div>
    </div>
    <div id="lista-sorteados" class="lista-sorteados"></div>
  </section>

  <div id="palco">
    <div id="wrapper">
      <div id="piao"></div>
      <div id="moldura"></div>
      <div id="piao-bg"></div>
    </div>
  </div>

  <audio id="trilha-piao" preload="auto" loop playsinline webkit-playsinline>
    <source src="piao-da-casa-propria-soundtrack.mp3" type="audio/mpeg" />
    <source src="piao-da-casa-propria-soundtrack.m4a" type="audio/mp4" />
    <source src="piao-da-casa-propria-soundtrack.ogg" type="audio/ogg" />
  </audio>

  <div id="decoracao"></div>

  <script type="text/javascript">
    (function () {
      var spinStyleEl = document.getElementById('spin-keyframes')
      if (!spinStyleEl) {
        spinStyleEl = document.createElement('style')
        spinStyleEl.id = 'spin-keyframes'
        document.head.appendChild(spinStyleEl)
      }

      var piao = document.querySelector('#piao')
      var painel = document.querySelector('#painel')
      var btnExpandirDrawer = document.querySelector('#btn-expandir-drawer')
      var btnRecolher = document.querySelector('#btn-recolher')
      var btnResetConfig = document.querySelector('#btn-reset-config')

      var botoesModo = document.querySelectorAll('#botoes-modo .btn-toggle')
      var modoSorteio = 'numeros'

      var btnMenosFaces = document.querySelector('#btn-menos-faces')
      var btnMaisFaces = document.querySelector('#btn-mais-faces')
      var integrantesInput = document.querySelector('#integrantes-input')

      var botoesSequencia = document.querySelectorAll('#botoes-sequencia .btn-toggle')
      var botoesRepeticao = document.querySelectorAll('#botoes-repeticao .btn-toggle')
      var sequenciaHabilitada = false
      var permitirRepeticao = false
      var velMultiplicador = 1

      var girarBtn = document.querySelector('#girar')
      var dicaEspaco = document.querySelector('#dica-espaco')

      var hudSorteados = document.querySelector('#hud-sorteados')
      var hudContador = document.querySelector('#hud-contador')
      var listaSorteados = document.querySelector('#lista-sorteados')
      var btnPosicaoHud = document.querySelector('#btn-posicao-hud')
      var limparHistoricoBtn = document.querySelector('#limpar-historico')
      var totalSorteadosCont = 0
      var hudPosicao = 'bottom'

      var audio = document.querySelector('#trilha-piao') || document.querySelector('audio')
      var toggleSomBtn = document.querySelector('#toggle-som')
      var somHabilitado = true
      var audioLiberado = false

      var girando = false
      var segurandoEspaco = false
      var sequenciaAtiva = false
      var anguloAcumulado = 0
      var tempoInicioEspaco = 0
      var RAIO_CILINDRO = 165
      var animFrameId = null
      var ponteiroSeguradoNoBotao = false

      function clampIntegrantes(n) {
        return Math.min(15, Math.max(2, Math.round(n)))
      }

      function obterQtdSorteios() {
        if (!sequenciaHabilitada) return 1
        return clampIntegrantes(Number(integrantesInput.value) || 6)
      }

      function obterRotuloFace(numIndex) {
        if (modoSorteio === 'letras') {
          return String.fromCharCode(64 + numIndex)
        }
        return String(numIndex)
      }

      function calcularFontSize(n, width, numero) {
        var rotulo = String(obterRotuloFace(numero))
        var numCaracteres = rotulo.length
        var base = (width * 0.95) / (numCaracteres > 1 ? 1.6 : 1.0)
        var fontSize = Math.min(240, Math.max(28, Math.round(base)))
        if (modoSorteio === 'letras') {
          fontSize = Math.round(fontSize * 0.9)
        }
        return fontSize
      }

      function limparDestaque() {
        var faces = piao.querySelectorAll('.numero')
        for (var i = 0; i < faces.length; i++) {
          faces[i].classList.remove('vencedor')
        }
      }

      function destacarVencedor(winnerFaceEl) {
        if (!winnerFaceEl) return
        winnerFaceEl.classList.add('vencedor')
      }

      function definirPosicaoHud(pos) {
        hudPosicao = pos
        if (pos === 'right') {
          hudSorteados.classList.remove('pos-bottom')
          hudSorteados.classList.add('pos-right')
          if (btnPosicaoHud) {
            btnPosicaoHud.textContent = '⬇️ Base'
            btnPosicaoHud.title = 'Mover painel para a base da tela (horizontal)'
          }
          hudSorteados.title = 'Toque no painel para mover para a base da tela (horizontal)'
        } else {
          hudSorteados.classList.remove('pos-right')
          hudSorteados.classList.add('pos-bottom')
          if (btnPosicaoHud) {
            btnPosicaoHud.textContent = '➡️ Lateral'
            btnPosicaoHud.title = 'Mover painel para a lateral direita (vertical)'
          }
          hudSorteados.title = 'Toque no painel para mover para a lateral direita (vertical)'
        }
      }

      function alternarPosicaoHud() {
        definirPosicaoHud(hudPosicao === 'bottom' ? 'right' : 'bottom')
      }

      function adicionarHistorico(rodada, num) {
        if (!sequenciaAtiva && obterQtdSorteios() <= 1) {
          hudSorteados.style.display = 'none'
          return
        }

        hudSorteados.style.display = 'flex'
        totalSorteadosCont++
        hudContador.textContent = String(totalSorteadosCont)

        var anteriores = listaSorteados.querySelectorAll('.badge-sorteado.recente')
        for (var i = 0; i < anteriores.length; i++) {
          anteriores[i].classList.remove('recente')
        }

        var badge = document.createElement('div')
        badge.className = 'badge-sorteado recente'
        var rotulo = obterRotuloFace(num)
        badge.innerHTML = '<span class="ordem-sorteado">' + rodada + 'º</span><span class="numero-sorteado">' + rotulo + '</span>'
        listaSorteados.appendChild(badge)

        if (hudPosicao === 'right') {
          listaSorteados.scrollTop = listaSorteados.scrollHeight
        } else {
          listaSorteados.scrollLeft = listaSorteados.scrollWidth
        }
      }

      function liberarAudioIOS() {
        if (!audio || audioLiberado) return
        audioLiberado = true
        var estavaMutado = audio.muted
        var volumeAnterior = audio.volume
        audio.muted = true
        audio.volume = 0
        var promessa = audio.play()
        if (promessa && typeof promessa.then === 'function') {
          promessa.then(function () {
            audio.pause()
            audio.currentTime = 0
            audio.muted = estavaMutado
            audio.volume = volumeAnterior || 1
          }).catch(function () {
            audioLiberado = false
            audio.muted = estavaMutado
            audio.volume = volumeAnterior || 1
          })
        } else {
          audio.pause()
          audio.currentTime = 0
          audio.muted = estavaMutado
          audio.volume = volumeAnterior || 1
        }
      }

      function atualizarBotoesSom() {
        if (!toggleSomBtn) return
        if (somHabilitado) {
          toggleSomBtn.className = 'btn-som ativo'
          toggleSomBtn.textContent = '🔊 Som Ligado'
        } else {
          toggleSomBtn.className = 'btn-som mudo'
          toggleSomBtn.textContent = '🔇 Som Mudo'
        }
      }

      function tocarMusica() {
        if (!somHabilitado || !audio) return
        liberarAudioIOS()
        try { audio.currentTime = 0 } catch (e) {}
        audio.play().catch(function () {})
      }

      function continuarMusica() {
        if (!somHabilitado || !audio) return
        liberarAudioIOS()
        audio.play().catch(function () {})
      }

      function pararMusica() {
        if (!audio) return
        audio.pause()
      }

      function alternarSom() {
        liberarAudioIOS()
        somHabilitado = !somHabilitado
        if (!somHabilitado) {
          pararMusica()
        } else if (girando || sequenciaAtiva || segurandoEspaco) {
          continuarMusica()
        }
        atualizarBotoesSom()
      }

      function atualizarBotoesModo() {
        for (var i = 0; i < botoesModo.length; i++) {
          var btn = botoesModo[i]
          btn.classList.toggle('ativo', btn.getAttribute('data-modo') === modoSorteio)
        }
        var labelFaces = document.querySelector('label[for="integrantes-input"]')
        if (labelFaces) {
          labelFaces.textContent = modoSorteio === 'letras' ? 'Faces / Letras (2 a 15)' : 'Faces (2 a 15)'
        }
      }

      function atualizarBotoesSequencia() {
        for (var i = 0; i < botoesSequencia.length; i++) {
          var btn = botoesSequencia[i]
          var ativo = btn.getAttribute('data-sequencia') === (sequenciaHabilitada ? 'sim' : 'nao')
          btn.classList.toggle('ativo', ativo)
        }
      }

      function atualizarBotoesRepeticao() {
        for (var i = 0; i < botoesRepeticao.length; i++) {
          var btn = botoesRepeticao[i]
          var ativo = btn.getAttribute('data-repetir') === (permitirRepeticao ? 'sim' : 'nao')
          btn.classList.toggle('ativo', ativo)
        }
      }

      function atualizarEstadoControles() {
        var n = clampIntegrantes(Number(integrantesInput.value) || 6)
        if (btnMenosFaces) btnMenosFaces.disabled = (n <= 2)
        if (btnMaisFaces) btnMaisFaces.disabled = (n >= 15)

        if (sequenciaHabilitada) {
          girarBtn.textContent = 'Sortear todos'
          dicaEspaco.innerHTML = '⚡ Vai sortear as <strong>' + n + '</strong> faces em sequência. Toque para iniciar.'
        } else {
          girarBtn.textContent = 'Girar Pião'
          dicaEspaco.innerHTML = '💡 Segure o botão para girar e solte para sortear'
        }
      }

      function definirPainelAtivo(ativo) {
        if (btnMenosFaces) btnMenosFaces.disabled = !ativo || Number(integrantesInput.value) <= 2
        if (btnMaisFaces) btnMaisFaces.disabled = !ativo || Number(integrantesInput.value) >= 15
        for (var k = 0; k < botoesRepeticao.length; k++) botoesRepeticao[k].disabled = !ativo
        for (var s = 0; s < botoesSequencia.length; s++) botoesSequencia[s].disabled = !ativo
        for (var m = 0; m < botoesModo.length; m++) botoesModo[m].disabled = !ativo
        if (btnResetConfig) btnResetConfig.disabled = !ativo
        if (ativo) atualizarEstadoControles()
      }

      function definirModoSorteio(modo) {
        modoSorteio = (modo === 'letras') ? 'letras' : 'numeros'
        atualizarBotoesModo()
        limparDestaque()
        construirPiao(clampIntegrantes(Number(integrantesInput.value)))
      }

      function definirSequencia(habilitada) {
        sequenciaHabilitada = !!habilitada
        atualizarBotoesSequencia()
        atualizarEstadoControles()
      }

      function definirRepeticao(permitir) {
        permitirRepeticao = !!permitir
        atualizarBotoesRepeticao()
      }

      function resetarConfiguracoes() {
        definirModoSorteio('numeros')
        definirQuantidadeFaces(6)
        definirSequencia(false)
        definirRepeticao(false)
      }

      function construirPiao(n) {
        piao.innerHTML = ''
        anguloAcumulado = 0
        piao.style.transform = 'rotateY(0deg)'
        piao.style.webkitTransform = 'rotateY(0deg)'

        if (n === 2) {
          var w2 = 165
          var r2 = 1.0
          for (var i2 = 0; i2 < 2; i2++) {
            var num2 = i2 + 1
            var face2 = document.createElement('div')
            face2.className = 'numero'
            face2.setAttribute('data-num', String(num2))
            face2.textContent = obterRotuloFace(num2)
            face2.style.width = w2 + 'px'
            face2.style.left = '50%'
            face2.style.marginLeft = (-w2 / 2) + 'px'
            face2.style.fontSize = calcularFontSize(2, w2, num2) + 'px'
            var anguloFace2 = i2 * 180
            face2.style.transform = 'rotateY(' + anguloFace2 + 'deg) translateZ(' + r2 + 'px)'
            face2.style.webkitTransform = face2.style.transform
            piao.appendChild(face2)
          }
          return
        }

        var anguloPasso = 360 / n
        var semiAnguloRad = Math.PI / n
        var w = 2 * RAIO_CILINDRO * Math.sin(semiAnguloRad) + 0.6
        var r = RAIO_CILINDRO * Math.cos(semiAnguloRad)

        for (var i = 0; i < n; i++) {
          var num = i + 1
          var face = document.createElement('div')
          face.className = 'numero'
          face.setAttribute('data-num', String(num))
          face.textContent = obterRotuloFace(num)
          face.style.width = w.toFixed(2) + 'px'
          face.style.left = '50%'
          face.style.marginLeft = (-w / 2).toFixed(2) + 'px'
          face.style.fontSize = calcularFontSize(n, w, num) + 'px'
          var anguloFace = i * anguloPasso
          face.style.transform = 'rotateY(' + anguloFace.toFixed(2) + 'deg) translateZ(' + r.toFixed(2) + 'px)'
          face.style.webkitTransform = face.style.transform
          piao.appendChild(face)
        }
      }

      function definirQuantidadeFaces(n) {
        var num = clampIntegrantes(n)
        integrantesInput.value = num
        limparDestaque()
        construirPiao(num)
        atualizarEstadoControles()
      }

      function pararAnimacaoAtual() {
        if (animFrameId) {
          cancelAnimationFrame(animFrameId)
          animFrameId = null
        }
        piao.style.animation = ''
        piao.style.webkitAnimation = ''
      }

      function aplicarRotacao(angulo) {
        anguloAcumulado = angulo
        piao.style.transform = 'rotateY(' + angulo + 'deg)'
        piao.style.webkitTransform = 'rotateY(' + angulo + 'deg)'
      }

      function executarDesaceleracaoFisica(n, omega0, callback, forcedWinnerNum) {
        pararAnimacaoAtual()
        limparDestaque()
        girando = true

        var winnerNum = (typeof forcedWinnerNum === 'number') ? forcedWinnerNum : (Math.floor(Math.random() * n) + 1)
        var winnerIndex = winnerNum - 1
        var anguloPasso = 360 / n
        var alvoAngulo = -(winnerIndex * anguloPasso)

        var T_desejado = Math.max(1.5, 3.2 / velMultiplicador)
        var p = 2.2
        var S_ideal = (omega0 * T_desejado) / p

        var anguloInicial = anguloAcumulado
        var diff = (anguloInicial - alvoAngulo) % 360
        if (diff < 0) diff += 360

        var voltas = Math.round((S_ideal - diff) / 360)
        if (voltas < 1) voltas = 1
        var S_real = voltas * 360 + diff
        var anguloFinal = anguloInicial - S_real

        var T_real = (p * S_real) / omega0
        var duracaoMs = T_real * 1000
        var tempoInicio = performance.now()

        function frame(agora) {
          var decorrido = agora - tempoInicio
          var u = Math.min(1, Math.max(0, decorrido / duracaoMs))
          var progresso = 1 - Math.pow(1 - u, p)
          var anguloAtual = anguloInicial - S_real * progresso
          aplicarRotacao(anguloAtual)

          if (u < 1) {
            animFrameId = requestAnimationFrame(frame)
          } else {
            animFrameId = null
            aplicarRotacao(anguloFinal)
            girando = false

            if (!sequenciaAtiva) {
              pararMusica()
            }

            var winnerFaceEl = piao.querySelector('[data-num="' + winnerNum + '"]')
            destacarVencedor(winnerFaceEl)

            if (callback) callback(winnerNum)
          }
        }

        animFrameId = requestAnimationFrame(frame)
      }

      function executarGiroUnico(n, duracao, callback, forcedWinnerNum) {
        var velLoop = 0.55 / velMultiplicador
        var omega0 = 360 / velLoop
        if (audio && audio.paused) {
          tocarMusica()
        } else {
          continuarMusica()
        }
        executarDesaceleracaoFisica(n, omega0, callback, forcedWinnerNum)
      }

      function iniciarSequencia(total) {
        sequenciaAtiva = true
        tocarMusica()
        listaSorteados.innerHTML = ''
        totalSorteadosCont = 0
        hudContador.textContent = '0'
        hudSorteados.style.display = 'flex'
        definirPainelAtivo(false)
        girarBtn.classList.add('parar')
        girarBtn.textContent = 'Parar Sequência'
        dicaEspaco.innerHTML = '⚡ Rodando sequência de <strong>' + total + '</strong> sorteios... Toque em Parar para interromper.'

        var rodadaAtual = 1
        var n = clampIntegrantes(Number(integrantesInput.value))
        var sorteadosNaSequencia = []
        var tempoPausa = Math.max(0.4, 1.4 / velMultiplicador) * 1000

        function proximo() {
          if (!sequenciaAtiva || rodadaAtual > total) {
            encerrarSequencia()
            return
          }

          var forcedNum = null
          if (!permitirRepeticao) {
            var disponiveis = []
            for (var c = 1; c <= n; c++) {
              if (sorteadosNaSequencia.indexOf(c) === -1) disponiveis.push(c)
            }
            if (disponiveis.length === 0) {
              encerrarSequencia()
              return
            }
            forcedNum = disponiveis[Math.floor(Math.random() * disponiveis.length)]
          }

          executarGiroUnico(n, 0, function (numSorteado) {
            if (!sequenciaAtiva) return
            sorteadosNaSequencia.push(numSorteado)
            adicionarHistorico(rodadaAtual, numSorteado)
            rodadaAtual++

            if (rodadaAtual <= total) {
              window.setTimeout(function () {
                if (sequenciaAtiva) proximo()
              }, tempoPausa)
            } else {
              window.setTimeout(function () {
                encerrarSequencia()
              }, tempoPausa)
            }
          }, forcedNum)
        }

        proximo()
      }

      function encerrarSequencia() {
        sequenciaAtiva = false
        pararMusica()
        pararAnimacaoAtual()
        girando = false
        girarBtn.classList.remove('parar')
        definirPainelAtivo(true)
        atualizarEstadoControles()
      }

      function iniciarSegurarEspaco() {
        if (girando || segurandoEspaco || sequenciaAtiva) return
        liberarAudioIOS()
        pararAnimacaoAtual()
        segurandoEspaco = true
        tempoInicioEspaco = performance.now()
        limparDestaque()
        girarBtn.classList.add('segurando')
        girarBtn.textContent = 'Solte para Sortear!'
        dicaEspaco.innerHTML = '🌀 O pião está girando! <strong>Solte</strong> para desacelerar!'

        tocarMusica()

        var anguloBase = anguloAcumulado
        var velLoopMs = (0.55 / velMultiplicador) * 1000

        function loopGiro(agora) {
          if (!segurandoEspaco) return
          var tempoDecorrido = agora - tempoInicioEspaco
          var anguloAtual = anguloBase - (tempoDecorrido / velLoopMs) * 360
          aplicarRotacao(anguloAtual)
          animFrameId = requestAnimationFrame(loopGiro)
        }

        animFrameId = requestAnimationFrame(loopGiro)
      }

      function finalizarSegurarEspaco() {
        if (!segurandoEspaco) return
        segurandoEspaco = false
        girarBtn.classList.remove('segurando')
        girarBtn.textContent = 'Sorteando...'
        dicaEspaco.innerHTML = '🎯 Desacelerando para a face vencedora...'

        var velLoop = 0.55 / velMultiplicador
        var omega0 = 360 / velLoop
        var n = clampIntegrantes(Number(integrantesInput.value))

        definirPainelAtivo(false)
        executarDesaceleracaoFisica(n, omega0, function () {
          definirPainelAtivo(true)
          atualizarEstadoControles()
        })
      }

      function dispararAcao() {
        liberarAudioIOS()
        if (sequenciaAtiva) {
          encerrarSequencia()
          return
        }

        var qtd = obterQtdSorteios()
        if (qtd > 1) {
          iniciarSequencia(qtd)
        } else {
          var n = clampIntegrantes(Number(integrantesInput.value))
          definirPainelAtivo(false)
          girarBtn.textContent = 'Sorteando...'
          executarGiroUnico(n, 0, function () {
            definirPainelAtivo(true)
            atualizarEstadoControles()
          })
        }
      }

      function atualizarEstadoConfiguracao() {
        if (painel && btnExpandirDrawer) {
          var estaAberto = painel.style.display !== 'none'
          btnExpandirDrawer.style.display = estaAberto ? 'none' : 'flex'
        }
      }

      if (toggleSomBtn) {
        toggleSomBtn.addEventListener('click', function () {
          liberarAudioIOS()
          alternarSom()
        })
      }

      window.addEventListener('keydown', function (e) {
        if (e.code !== 'Space') return
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON')) return
        e.preventDefault()

        if (sequenciaAtiva) {
          encerrarSequencia()
          return
        }

        var qtd = obterQtdSorteios()
        if (qtd > 1) {
          if (!girando) iniciarSequencia(qtd)
        } else if (!e.repeat) {
          iniciarSegurarEspaco()
        }
      })

      window.addEventListener('keyup', function (e) {
        if (e.code !== 'Space') return
        e.preventDefault()
        if (segurandoEspaco) finalizarSegurarEspaco()
      })

      function iniciarPonteiroNoBotao(e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return
        liberarAudioIOS()
        var qtd = obterQtdSorteios()
        if (qtd === 1 && !sequenciaAtiva && !girando) {
          ponteiroSeguradoNoBotao = true
          if (girarBtn.setPointerCapture && e.pointerId != null) {
            try { girarBtn.setPointerCapture(e.pointerId) } catch (err) {}
          }
          iniciarSegurarEspaco()
        }
      }

      function finalizarPonteiroNoBotao() {
        if (!ponteiroSeguradoNoBotao) return
        ponteiroSeguradoNoBotao = false
        if (segurandoEspaco) finalizarSegurarEspaco()
      }

      girarBtn.addEventListener('pointerdown', iniciarPonteiroNoBotao)
      girarBtn.addEventListener('pointerup', finalizarPonteiroNoBotao)
      girarBtn.addEventListener('pointercancel', finalizarPonteiroNoBotao)
      girarBtn.addEventListener('lostpointercapture', finalizarPonteiroNoBotao)

      girarBtn.addEventListener('click', function (e) {
        // Evita disparo duplo após hold no toque/mouse
        if (girando || segurandoEspaco || ponteiroSeguradoNoBotao) {
          e.preventDefault()
          return
        }
        dispararAcao()
      })

      btnMenosFaces.addEventListener('click', function () {
        definirQuantidadeFaces(Number(integrantesInput.value) - 1)
      })
      btnMaisFaces.addEventListener('click', function () {
        definirQuantidadeFaces(Number(integrantesInput.value) + 1)
      })

      for (var m = 0; m < botoesModo.length; m++) {
        botoesModo[m].addEventListener('click', function () {
          definirModoSorteio(this.getAttribute('data-modo'))
        })
      }

      for (var s = 0; s < botoesSequencia.length; s++) {
        botoesSequencia[s].addEventListener('click', function () {
          definirSequencia(this.getAttribute('data-sequencia') === 'sim')
        })
      }

      for (var r = 0; r < botoesRepeticao.length; r++) {
        botoesRepeticao[r].addEventListener('click', function () {
          definirRepeticao(this.getAttribute('data-repetir') === 'sim')
        })
      }

      if (btnResetConfig) {
        btnResetConfig.addEventListener('click', resetarConfiguracoes)
      }

      if (btnRecolher) {
        btnRecolher.addEventListener('click', function () {
          painel.style.display = 'none'
          atualizarEstadoConfiguracao()
        })
      }

      if (btnExpandirDrawer) {
        btnExpandirDrawer.addEventListener('click', function () {
          painel.style.display = 'block'
          atualizarEstadoConfiguracao()
        })
      }

      if (btnPosicaoHud) {
        btnPosicaoHud.addEventListener('click', function (e) {
          e.stopPropagation()
          alternarPosicaoHud()
        })
      }

      hudSorteados.addEventListener('click', function (e) {
        if (e.target.closest('#limpar-historico')) return
        alternarPosicaoHud()
      })

      limparHistoricoBtn.addEventListener('click', function (e) {
        e.stopPropagation()
        listaSorteados.innerHTML = ''
        totalSorteadosCont = 0
        hudContador.textContent = '0'
        hudSorteados.style.display = 'none'
      })

      // Primeiro toque em qualquer controle libera áudio no iOS/Chrome
      document.addEventListener('pointerdown', function () {
        liberarAudioIOS()
      }, { once: true, passive: true })

      definirQuantidadeFaces(6)
      definirSequencia(false)
      definirRepeticao(false)
      atualizarBotoesSom()
      atualizarEstadoConfiguracao()
      definirPosicaoHud('bottom')
    })()
  </script>
</body>
</html>
