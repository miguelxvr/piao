<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Pião — Sorteio de Apresentação</title>
  <style type="text/css" media="screen">
    :root {
      --bg-1: #f1f1ef;
      --bg-2: #d1d0cb;
      --metal: #d0d7de;
      --metal-shadow: #727a84;
      --face-1: #0d0d0f;
      --face-2: #050505;
      --face-text: #ffffff;
      --frame-red: #d80f24;
      --red-cta-2: rgb(160,0,0);
      --scene-1: #1a1d18;
      --piao-bg: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0.04) 22%, rgba(0,0,0,0.12) 46%, rgba(0,0,0,0.8) 100%), linear-gradient(180deg, #1d1d1b 0%, #090909 100%);
      --moldura-shadow: inset 0 0 25px 8px rgba(0, 0, 0, 0.9), inset 0 3px 6px rgba(255, 255, 255, 0.4), inset 0 -3px 6px rgba(0, 0, 0, 0.45);
      --scene-bg: radial-gradient(circle at var(--centro-x, 50%) var(--centro-y, 50%), rgba(0, 0, 0, 0.75) calc(205px * var(--escala, 1)), rgba(0, 0, 0, 0.42) calc(248px * var(--escala, 1)), rgba(0, 0, 0, 0.15) calc(290px * var(--escala, 1)), transparent calc(360px * var(--escala, 1))), radial-gradient(circle at 50% 20%, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.05) 50%, transparent 80%), radial-gradient(circle at 50% 50%, transparent 60%, rgba(0, 0, 0, 0.22) 100%), repeating-conic-gradient(from 0deg at var(--centro-x, 50%) var(--centro-y, 50%), #e5eae1 0deg, #d6dcd2 3.2deg, #c5ccc1 6.8deg, #161914 6.8deg, #161914 7.5deg);
    }

    html {
      height: 100%;
      height: 100dvh;
      background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      position: relative;
      height: 100%;
      height: 100dvh;
      width: 100%;
      margin: 0;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      background: linear-gradient(180deg, rgba(0,0,0,0.06), rgba(0,0,0,0.18));
      color: #111;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #palco {
      --cta-reserve: calc(112px + env(safe-area-inset-bottom, 0px));
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      bottom: var(--cta-reserve);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
      pointer-events: none;
      z-index: 1;
      -webkit-transform-origin: center center;
      transform-origin: center center;
      -webkit-transform-style: preserve-3d;
      transform-style: preserve-3d;
    }

    #wrapper {
      width: 400px;
      height: 400px;
      position: relative;
      left: auto;
      top: auto;
      margin: 0;
      flex: 0 0 auto;
      -webkit-transform-style: preserve-3d;
      transform-style: preserve-3d;
      pointer-events: none;
    }

    #piao {
      position: relative;
      top: 65px;
      margin: 0 auto;
      height: 270px;
      width: 165px;
      -webkit-transform-style: preserve-3d;
      transform-style: preserve-3d;
    }

    #piao .numero {
      position: absolute;
      height: 100%;
      border: 5px solid var(--metal);
      border-radius: 8px;
      box-shadow:
        inset 0 0 0 1px var(--metal-shadow),
        inset 0 1px 2px rgba(255, 255, 255, 0.85),
        0 0 0 1px #3c4248,
        0 10px 18px rgba(0, 0, 0, 0.25);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 195px;
      line-height: 0.9;
      letter-spacing: -0.08em;
      white-space: nowrap;
      overflow: hidden;
      color: var(--face-text);
      text-shadow: 0 2px 0 rgba(0,0,0,0.8), 0 0 10px rgba(0,0,0,0.35);
      background: linear-gradient(145deg, var(--face-1) 0%, var(--face-2) 35%, #101114 100%);
      box-sizing: border-box;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      user-select: none;
      transition: color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    #piao .numero::before {
      content: "";
      position: absolute;
      inset: 8px 10px 10px 10px;
      border-radius: 6px;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.02), rgba(0,0,0,0.18));
      pointer-events: none;
    }

    #moldura {
      height: 400px;
      width: 400px;
      border: 45px solid var(--frame-red);
      border-radius: 50%;
      position: absolute;
      top: -45px;
      left: -45px;
      box-sizing: content-box;
      /* Z moderado: valores altos (ex.: 400) estouram o clipping do WebKit/iOS */
      -webkit-transform: translateZ(180px);
      transform: translateZ(180px);
      box-shadow: var(--moldura-shadow);
    }

    #piao-bg {
      height: 404px;
      width: 404px;
      border-radius: 50%;
      position: absolute;
      top: -2px;
      left: -2px;
      background: var(--piao-bg);
      box-shadow: inset 0 0 0 3px rgba(255,255,255,0.08), inset 0 -18px 20px rgba(0,0,0,0.45), 0 0 22px rgba(0,0,0,0.16);
      -webkit-transform: translateZ(1px);
      transform: translateZ(1px);
    }

    /* Sombra externa da moldura fora do contexto 3D (lá ela era recortada num retângulo) */
    #moldura-sombra {
      position: fixed;
      left: var(--centro-x, 50%);
      top: var(--centro-y, 50%);
      width: calc(490px * var(--escala, 1));
      height: calc(490px * var(--escala, 1));
      transform: translate(-50%, -50%);
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
      box-shadow:
        0 0 calc(28px * var(--escala, 1)) calc(4px * var(--escala, 1)) rgba(220, 15, 25, 0.35),
        0 calc(18px * var(--escala, 1)) calc(48px * var(--escala, 1)) rgba(0, 0, 0, 0.65),
        0 calc(4px * var(--escala, 1)) calc(14px * var(--escala, 1)) rgba(0, 0, 0, 0.4);
    }

    /* Área invisível sobre o pião para girá-lo com o dedo / mouse */
    #area-giro {
      position: fixed;
      left: var(--centro-x, 50%);
      top: var(--centro-y, 50%);
      width: calc(490px * var(--escala, 1));
      height: calc(490px * var(--escala, 1));
      transform: translate(-50%, -50%);
      border-radius: 50%;
      z-index: 2;
      cursor: grab;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #area-giro.arrastando {
      cursor: grabbing;
    }

    #decoracao {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
      background-color: var(--scene-1);
      background-image: var(--scene-bg);
    }

    /* ================= UI ================= */
    :root {
      --ui-gold: #ffd700;
      --vidro: rgba(0, 0, 0, 0.55);
      --vidro-borda: rgba(255, 255, 255, 0.22);
      --focus-ring: 0 0 0 3px #fff, 0 0 0 6px #1565c0;
    }

    button {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    #area-giro:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring) !important;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Espaço do pião: abaixo da barra de ícones e acima da faixa de sorteados */
    #palco {
      top: calc(64px + env(safe-area-inset-top, 0px));
      --cta-reserve: calc(82px + env(safe-area-inset-bottom, 0px));
    }

    /* ---------- Barras de ícones ---------- */
    .barra {
      position: fixed;
      top: max(12px, env(safe-area-inset-top, 0px));
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .barra-esq {
      left: max(12px, env(safe-area-inset-left, 0px));
    }

    .barra-dir {
      right: max(12px, env(safe-area-inset-right, 0px));
    }

    .icone {
      width: 44px;
      height: 44px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: var(--vidro);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--vidro-borda);
      border-radius: 50%;
      cursor: pointer;
      font: 800 13px/1 system-ui, -apple-system, sans-serif;
      letter-spacing: 0.3px;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
      touch-action: manipulation;
    }

    .icone[hidden] {
      display: none;
    }

    .icone:hover:not(:disabled) {
      background: rgba(0, 0, 0, 0.75);
    }

    /* Ligado: destaque dourado */
    .icone[aria-pressed="true"] {
      color: var(--ui-gold);
      border-color: var(--ui-gold);
    }

    /* Som: desligado fica apagado */
    #btn-som[aria-pressed="false"] {
      color: rgba(255, 255, 255, 0.5);
    }

    .icone:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .faces {
      display: flex;
      align-items: center;
      height: 44px;
      background: var(--vidro);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--vidro-borda);
      border-radius: 22px;
      color: #fff;
    }

    .faces .icone {
      width: 38px;
      height: 42px;
      background: transparent;
      border: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      font-size: 22px;
      font-weight: 600;
    }

    .faces-valor {
      min-width: 24px;
      text-align: center;
      font: 800 17px/1 system-ui, -apple-system, sans-serif;
    }

    /* Sequência rodando: ícone pulsa */
    #btn-todos.rodando {
      animation: pulsar 1s infinite alternate ease-in-out;
    }

    @keyframes pulsar {
      0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
      100% { box-shadow: 0 0 0 5px rgba(255, 215, 0, 0.35); }
    }

    /* Faces já sorteadas ("não repetir") */
    #piao .numero.fora {
      color: rgba(255, 255, 255, 0.22);
    }

    /* ---------- Sorteados ---------- */
    #hud-sorteados {
      position: fixed;
      z-index: 80;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: min(94vw, 680px);
      height: 50px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 4px 0 8px;
      box-sizing: border-box;
      background: rgba(12, 12, 12, 0.62);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 215, 0, 0.35);
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      color: #fff;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    #hud-sorteados[hidden] {
      display: none;
    }

    #hud-sorteados.completo {
      border-color: var(--ui-gold);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35), 0 0 14px rgba(255, 215, 0, 0.45);
    }

    .lista-sorteados {
      display: flex;
      flex: 0 1 auto;
      gap: 6px;
      min-width: 0;
      height: 100%;
      align-items: center;
      margin: 0;
      padding: 0;
      list-style: none;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
    }

    .lista-sorteados::-webkit-scrollbar {
      display: none;
    }

    .badge-sorteado {
      display: inline-flex;
      align-items: baseline;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      padding: 3px 9px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      flex-shrink: 0;
      animation: badge-surgir 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .badge-sorteado .numero-sorteado {
      font-size: 20px;
      line-height: 1.1;
      font-family: 'Impact', 'Arial Black', sans-serif;
      letter-spacing: 0.5px;
    }

    .badge-sorteado.recente {
      border-color: var(--ui-gold);
      background: var(--red-cta-2);
    }

    .badge-sorteado.recente .numero-sorteado {
      color: var(--ui-gold);
    }

    @keyframes badge-surgir {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .hud-acoes {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }

    .hud-acoes button {
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      opacity: 0.85;
    }

    .hud-acoes button:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.12);
      opacity: 1;
    }

    .hud-acoes button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* ---------- Aviso ---------- */
    #toast {
      position: fixed;
      left: 50%;
      top: calc(68px + env(safe-area-inset-top, 0px));
      transform: translateX(-50%);
      z-index: 120;
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: min(92vw, 440px);
      padding: 10px 10px 10px 16px;
      background: #222;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      pointer-events: none;
    }

    #toast[hidden],
    #toast button[hidden] {
      display: none;
    }

    #toast button {
      min-height: 36px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 800;
      color: var(--ui-gold);
      background: transparent;
      border: 1px solid rgba(255, 215, 0, 0.5);
      border-radius: 8px;
      cursor: pointer;
      pointer-events: auto;
    }

    /* Telas bem estreitas (ex.: 320px): ícones um pouco menores para as barras não se encostarem */
    @media (max-width: 359px) {
      .barra {
        gap: 4px;
      }
      .barra-esq {
        left: max(8px, env(safe-area-inset-left, 0px));
      }
      .barra-dir {
        right: max(8px, env(safe-area-inset-right, 0px));
      }
      .icone {
        width: 40px;
        height: 40px;
      }
      .faces {
        height: 40px;
      }
      .faces .icone {
        width: 32px;
        height: 38px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #btn-todos.rodando,
      .badge-sorteado {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="barra barra-esq">
    <div class="faces" role="group" aria-label="Quantidade de faces">
      <button type="button" class="icone" id="btn-menos-faces" title="Menos faces" aria-label="Menos faces">−</button>
      <span class="faces-valor" id="faces-valor" aria-live="polite">6</span>
      <button type="button" class="icone" id="btn-mais-faces" title="Mais faces" aria-label="Mais faces">+</button>
    </div>
    <button type="button" class="icone" id="btn-rotulos" title="Trocar para letras" aria-label="Faces com números. Trocar para letras">123</button>
  </div>

  <div class="barra barra-dir">
    <button type="button" class="icone" id="btn-roda" aria-pressed="false" title="Não repetir quem já saiu" aria-label="Não repetir quem já saiu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/><path d="M3 3l18 18"/></svg></button>
    <button type="button" class="icone" id="btn-todos" aria-pressed="false" title="Sortear todos em sequência" aria-label="Sortear todos em sequência"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6h11M10 12h11M10 18h11"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></svg></button>
    <button type="button" class="icone" id="btn-som" aria-pressed="true" title="Som (S)" aria-label="Som ligado"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg></button>
    <button type="button" class="icone" id="btn-tela-cheia" aria-pressed="false" title="Tela cheia (F)" aria-label="Tela cheia"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
  </div>

  <div id="anuncio" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

  <section id="hud-sorteados" aria-label="Sorteados" hidden>
    <ol id="lista-sorteados" class="lista-sorteados"></ol>
    <div class="hud-acoes">
      <button type="button" id="btn-copiar" title="Copiar ordem" aria-label="Copiar ordem dos sorteados"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
      <button type="button" id="btn-limpar" title="Limpar" aria-label="Limpar sorteados"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
    </div>
  </section>

  <div id="toast" role="status" hidden>
    <span id="toast-texto"></span>
    <button type="button" id="toast-acao" hidden></button>
  </div>

  <div id="palco">
    <div id="wrapper">
      <div id="piao"></div>
      <div id="moldura"></div>
      <div id="piao-bg"></div>
    </div>
  </div>

  <div id="moldura-sombra" aria-hidden="true"></div>
  <div id="area-giro" role="button" tabindex="0" aria-label="Pião. Toque duas vezes ou arraste para girar"></div>
  <div id="decoracao"></div>

  <script type="text/javascript">
    (function () {
      var $ = function (sel) { return document.querySelector(sel) }

      var piao = $('#piao')
      var btnMenosFaces = $('#btn-menos-faces')
      var btnMaisFaces = $('#btn-mais-faces')
      var facesValor = $('#faces-valor')
      var btnRotulos = $('#btn-rotulos')
      var btnRoda = $('#btn-roda')
      var btnTodos = $('#btn-todos')
      var btnSom = $('#btn-som')
      var btnTelaCheia = $('#btn-tela-cheia')
      var anuncio = $('#anuncio')
      var hud = $('#hud-sorteados')
      var listaSorteados = $('#lista-sorteados')
      var btnCopiar = $('#btn-copiar')
      var btnLimpar = $('#btn-limpar')
      var toast = $('#toast')
      var toastTexto = $('#toast-texto')
      var toastAcao = $('#toast-acao')

      var ICONE_SOM = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>'
      var ICONE_MUDO = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6M16 9l6 6"/></svg>'
      var TITULO_BASE = 'Pião — Sorteio de Apresentação'
      var RAIO_CILINDRO = 165
      var VEL_BASE = 360 / 0.55 // graus/s
      var MIN_FACES = 2, MAX_FACES = 15
      var RESERVA_TOPO = 64 // barra de ícones
      var reduzirMovimento = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)

      // Estado inicial; nada é salvo: recarregar a página volta a ele
      var cfg = { modo: 'unico', faces: 6, rotulos: 'numeros', tirarDaRoda: false, som: true }

      // Estado de execução
      var historico = [] // números sorteados, em ordem
      var girando = false
      var segurando = false
      var sequenciaAtiva = false
      var idSequencia = 0
      var ultimaSequenciaCompleta = false
      var anguloAcumulado = 0
      var animFrameId = null
      var arrastando = false

      function limitar(n, min, max) {
        return Math.min(max, Math.max(min, Math.round(n)))
      }

      // ---------- Rótulos ----------
      function rotulo(num) {
        return cfg.rotulos === 'letras' ? String.fromCharCode(64 + num) : String(num)
      }

      // ---------- Construção do pião 3D (inalterado) ----------
      function calcularFontSize(width, numero) {
        var numCaracteres = rotulo(numero).length
        var base = (width * 0.95) / (numCaracteres > 1 ? 1.6 : 1.0)
        var fontSize = Math.min(240, Math.max(28, Math.round(base)))
        if (cfg.rotulos === 'letras') fontSize = Math.round(fontSize * 0.9)
        return fontSize
      }

      function construirPiao(n) {
        piao.innerHTML = ''
        anguloAcumulado = 0
        piao.style.transform = 'rotateY(0deg)'
        piao.style.webkitTransform = 'rotateY(0deg)'
        if (n === 2) {
          var w2 = 165
          var r2 = 24 // afastado do plano do fundo (#piao-bg em translateZ(1px)); com 1px o Safari corta a face
          for (var i2 = 0; i2 < 2; i2++) {
            var num2 = i2 + 1
            var face2 = document.createElement('div')
            face2.className = 'numero'
            face2.setAttribute('data-num', String(num2))
            face2.textContent = rotulo(num2)
            face2.style.width = w2 + 'px'
            face2.style.left = '50%'
            face2.style.marginLeft = (-w2 / 2) + 'px'
            face2.style.fontSize = calcularFontSize(w2, num2) + 'px'
            face2.style.transform = 'rotateY(' + (i2 * 180) + 'deg) translateZ(' + r2 + 'px)'
            face2.style.webkitTransform = face2.style.transform
            piao.appendChild(face2)
          }
          aplicarForaDaRoda()
          return
        }
        var anguloPasso = 360 / n
        var semiAnguloRad = Math.PI / n
        var w = 2 * RAIO_CILINDRO * Math.sin(semiAnguloRad) + 0.6
        var r = RAIO_CILINDRO * Math.cos(semiAnguloRad)
        for (var i = 0; i < n; i++) {
          var num = i + 1
          var face = document.createElement('div')
          face.className = 'numero'
          face.setAttribute('data-num', String(num))
          face.textContent = rotulo(num)
          face.style.width = w.toFixed(2) + 'px'
          face.style.left = '50%'
          face.style.marginLeft = (-w / 2).toFixed(2) + 'px'
          face.style.fontSize = calcularFontSize(w, num) + 'px'
          face.style.transform = 'rotateY(' + (i * anguloPasso).toFixed(2) + 'deg) translateZ(' + r.toFixed(2) + 'px)'
          face.style.webkitTransform = face.style.transform
          piao.appendChild(face)
        }
        aplicarForaDaRoda()
      }

      // ---------- Roda (quem já saiu) ----------
      function rodaAtiva() {
        return cfg.modo === 'unico' && cfg.tirarDaRoda
      }

      function foraDaRoda() {
        if (!rodaAtiva()) return []
        var fora = []
        for (var i = 0; i < historico.length; i++) {
          if (fora.indexOf(historico[i]) === -1) fora.push(historico[i])
        }
        return fora
      }

      function restantesNaRoda() {
        var fora = foraDaRoda()
        var r = []
        for (var c = 1; c <= cfg.faces; c++) if (fora.indexOf(c) === -1) r.push(c)
        return r
      }

      function aplicarForaDaRoda() {
        var fora = foraDaRoda()
        var faces = piao.querySelectorAll('.numero')
        for (var i = 0; i < faces.length; i++) {
          var num = Number(faces[i].getAttribute('data-num'))
          faces[i].classList.toggle('fora', fora.indexOf(num) !== -1)
        }
      }

      function sortearEntre(lista) {
        return lista[Math.floor(Math.random() * lista.length)]
      }

      // ---------- Áudio (Web Audio API) ----------
      // A trilha é baixada e decodificada uma vez num AudioBuffer. O AudioContext é destravado
      // (resume) em gestos do usuário; depois disso cada giro cria um AudioBufferSourceNode e
      // toca na hora, sem passar pelas regras de play() do <audio> (gesto por chamada,
      // autoplay, seek). No iOS a sessão é "playback" para não ser silenciada pela chave lateral.
      var ARQUIVOS_TRILHA = ['piao-da-casa-propria-soundtrack.mp3', 'piao-da-casa-propria-soundtrack.m4a', 'piao-da-casa-propria-soundtrack.ogg']
      var FADE_S = 0.08
      var ctxAudio = null
      var ganhoMestre = null
      var bufferTrilha = null
      var fonteAtual = null
      var ganhoFonte = null
      var musicaDesejada = false

      function criarContextoAudio() {
        if (ctxAudio) return ctxAudio
        var Ctx = window.AudioContext || window.webkitAudioContext
        if (!Ctx) return null
        try {
          if (navigator.audioSession) navigator.audioSession.type = 'playback'
        } catch (e) {}
        ctxAudio = new Ctx()
        ganhoMestre = ctxAudio.createGain()
        ganhoMestre.connect(ctxAudio.destination)
        carregarTrilha(0)
        return ctxAudio
      }

      function decodificar(dados) {
        return new Promise(function (ok, falha) {
          // forma com callbacks: compatível com Safari antigo
          ctxAudio.decodeAudioData(dados, ok, falha)
        })
      }

      function carregarTrilha(indice) {
        if (indice >= ARQUIVOS_TRILHA.length) return
        fetch(ARQUIVOS_TRILHA[indice])
          .then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status)
            return r.arrayBuffer()
          })
          .then(decodificar)
          .then(function (buffer) {
            bufferTrilha = buffer
            if (musicaDesejada) iniciarFonte()
          })
          .catch(function () { carregarTrilha(indice + 1) })
      }

      // Chamado em todo gesto: cria/retoma o contexto (iOS pode suspendê-lo ou "interrompê-lo")
      function liberarAudioIOS() {
        if (!cfg.som) return
        var ctx = criarContextoAudio()
        if (ctx && ctx.state !== 'running' && ctx.state !== 'closed') {
          var r = ctx.resume()
          if (r && r.catch) r.catch(function () {})
        }
      }

      function pararFonte() {
        if (!fonteAtual) return
        var fonte = fonteAtual, ganho = ganhoFonte
        fonteAtual = ganhoFonte = null
        try {
          var t = ctxAudio.currentTime
          ganho.gain.cancelScheduledValues(t)
          ganho.gain.setValueAtTime(ganho.gain.value, t)
          ganho.gain.linearRampToValueAtTime(0, t + FADE_S)
          fonte.stop(t + FADE_S + 0.02)
        } catch (e) {
          try { fonte.stop() } catch (e2) {}
        }
      }

      function iniciarFonte() {
        if (!ctxAudio || !bufferTrilha) return
        pararFonte()
        var fonte = ctxAudio.createBufferSource()
        fonte.buffer = bufferTrilha
        fonte.loop = true
        var ganho = ctxAudio.createGain()
        ganho.gain.value = 1
        fonte.connect(ganho)
        ganho.connect(ganhoMestre)
        fonte.start(0)
        fonteAtual = fonte
        ganhoFonte = ganho
      }

      function tocarMusica() {
        if (!cfg.som) return
        musicaDesejada = true
        liberarAudioIOS()
        iniciarFonte() // se o buffer ainda está carregando, começa assim que ficar pronto
      }

      function continuarMusica() {
        if (!cfg.som) return
        musicaDesejada = true
        liberarAudioIOS()
        if (!fonteAtual) iniciarFonte()
      }

      function pararMusica() {
        musicaDesejada = false
        pararFonte()
      }

      // Para depuração e testes: estado real do motor de áudio
      window.__piaoAudio = function () {
        return {
          contexto: ctxAudio ? ctxAudio.state : 'nenhum',
          carregado: !!bufferTrilha,
          tocando: !!fonteAtual,
          audivel: !!(fonteAtual && ctxAudio && ctxAudio.state === 'running')
        }
      }

      function definirSom(ligado) {
        cfg.som = !!ligado
        if (!cfg.som) {
          pararMusica()
        } else if (girando || sequenciaAtiva || segurando) {
          continuarMusica()
        }
        btnSom.setAttribute('aria-pressed', String(cfg.som))
        btnSom.innerHTML = cfg.som ? ICONE_SOM : ICONE_MUDO
        btnSom.setAttribute('aria-label', cfg.som ? 'Som ligado' : 'Som desligado')
        btnSom.title = (cfg.som ? 'Som ligado' : 'Som desligado') + ' (S)'
      }

      // ---------- Estado dos ícones ----------
      function emRepouso() {
        return !(girando || sequenciaAtiva || segurando || arrastando)
      }

      function atualizarTudo() {
        var livre = emRepouso()
        facesValor.textContent = String(cfg.faces)
        btnMenosFaces.disabled = !livre || cfg.faces <= MIN_FACES
        btnMaisFaces.disabled = !livre || cfg.faces >= MAX_FACES
        var letras = cfg.rotulos === 'letras'
        btnRotulos.textContent = letras ? 'ABC' : '123'
        btnRotulos.title = letras ? 'Trocar para números' : 'Trocar para letras'
        btnRotulos.setAttribute('aria-label', (letras ? 'Faces com letras. Trocar para números' : 'Faces com números. Trocar para letras'))
        btnRotulos.disabled = !livre
        btnRoda.setAttribute('aria-pressed', String(cfg.tirarDaRoda))
        btnRoda.disabled = !livre || cfg.modo !== 'unico'
        btnTodos.setAttribute('aria-pressed', String(cfg.modo === 'sequencia'))
        btnTodos.classList.toggle('rodando', sequenciaAtiva)
        btnTodos.title = sequenciaAtiva ? 'Parar sequência' : 'Sortear todos em sequência'
        btnTodos.disabled = !livre && !sequenciaAtiva
        atualizarHud()
      }

      // Para depuração e testes: estado atual (somente leitura)
      window.__piaoEstado = function () {
        return { modo: cfg.modo, faces: cfg.faces, rotulos: cfg.rotulos, naoRepetir: cfg.tirarDaRoda, som: cfg.som, girando: girando, sequencia: sequenciaAtiva, emRepouso: emRepouso(), historico: historico.slice(), angulo: anguloAcumulado }
      }

      // ---------- Alterações ----------
      function zerarSeNecessario() {
        if (historico.length) {
          limparHistorico()
          mostrarToast('Sorteados zerados')
        } else {
          ultimaSequenciaCompleta = false
        }
      }

      function definirFaces(n) {
        if (!emRepouso()) return
        var novo = limitar(n, MIN_FACES, MAX_FACES)
        if (novo === cfg.faces) return
        cfg.faces = novo
        zerarSeNecessario()
        construirPiao(cfg.faces)
        atualizarTudo()
      }

      function alternarRotulos() {
        if (!emRepouso()) return
        cfg.rotulos = cfg.rotulos === 'letras' ? 'numeros' : 'letras'
        construirPiao(cfg.faces)
        renderizarHistorico()
        atualizarTudo()
      }

      function alternarModo() {
        if (sequenciaAtiva) {
          encerrarSequencia(false)
          return
        }
        if (!emRepouso()) return
        cfg.modo = cfg.modo === 'sequencia' ? 'unico' : 'sequencia'
        zerarSeNecessario()
        aplicarForaDaRoda()
        atualizarTudo()
        mostrarToast(cfg.modo === 'sequencia' ? 'Todos em sequência' : 'Um por vez')
      }

      function alternarRoda() {
        if (!emRepouso() || cfg.modo !== 'unico') return
        cfg.tirarDaRoda = !cfg.tirarDaRoda
        aplicarForaDaRoda()
        atualizarTudo()
        mostrarToast(cfg.tirarDaRoda ? 'Não repetir quem já saiu' : 'Pode repetir')
      }

      // ---------- Física do giro (inalterada, com duração configurável) ----------
      function pararAnimacaoAtual() {
        if (animFrameId) {
          cancelAnimationFrame(animFrameId)
          animFrameId = null
        }
      }

      function aplicarRotacao(angulo) {
        anguloAcumulado = angulo
        piao.style.transform = 'rotateY(' + angulo + 'deg)'
        piao.style.webkitTransform = 'rotateY(' + angulo + 'deg)'
      }

      function duracaoGiro(forca) {
        if (reduzirMovimento) return 1.2
        return 2.2 + 2.0 * forca
      }

      var arrasteSentidoPositivo = false // só um giro vindo do arraste pode ir no sentido positivo

      function executarDesaceleracaoFisica(n, omega0, T_desejado, callback, forcedWinnerNum) {
        pararAnimacaoAtual()
        girando = true
        var winnerNum = (typeof forcedWinnerNum === 'number') ? forcedWinnerNum : (Math.floor(Math.random() * n) + 1)
        var anguloPasso = 360 / n
        var alvoAngulo = -((winnerNum - 1) * anguloPasso)
        // sentido: velocidade positiva (arrastar para a direita) gira para o outro lado
        var sentido = omega0 > 0 && arrasteSentidoPositivo ? 1 : -1
        arrasteSentidoPositivo = false
        omega0 = Math.abs(omega0)
        var p = 2.2
        var S_ideal = (omega0 * T_desejado) / p
        var anguloInicial = anguloAcumulado
        var diff = (sentido < 0 ? (anguloInicial - alvoAngulo) : (alvoAngulo - anguloInicial)) % 360
        if (diff < 0) diff += 360
        var voltas = Math.round((S_ideal - diff) / 360)
        if (voltas < 1) voltas = 1
        var S_real = voltas * 360 + diff
        var anguloFinal = anguloInicial + sentido * S_real
        var duracaoMs = ((p * S_real) / omega0) * 1000
        var tempoInicio = performance.now()
        function frame(agora) {
          var u = Math.min(1, Math.max(0, (agora - tempoInicio) / duracaoMs))
          aplicarRotacao(anguloInicial + sentido * S_real * (1 - Math.pow(1 - u, p)))
          if (u < 1) {
            animFrameId = requestAnimationFrame(frame)
          } else {
            animFrameId = null
            aplicarRotacao(anguloFinal)
            girando = false
            if (!sequenciaAtiva) pararMusica()
            if (callback) callback(winnerNum)
          }
        }
        animFrameId = requestAnimationFrame(frame)
      }

      // ---------- Resultado ----------
      function mostrarResultado(num, prefixo) {
        var r = rotulo(num)
        anuncio.textContent = prefixo + ': ' + r
        document.title = r + ' — Pião'
      }

      // ---------- Histórico ----------
      function renderizarHistorico() {
        listaSorteados.innerHTML = ''
        for (var i = 0; i < historico.length; i++) {
          listaSorteados.appendChild(criarBadge(i + 1, historico[i], i === historico.length - 1))
        }
        atualizarHud()
      }

      function criarBadge(ordem, num, recente) {
        var li = document.createElement('li')
        li.className = 'badge-sorteado' + (recente ? ' recente' : '')
        li.innerHTML = '<span class="sr-only">' + ordem + 'º: </span><span class="numero-sorteado">' + rotulo(num) + '</span>'
        return li
      }

      function adicionarHistorico(num) {
        historico.push(num)
        var anteriores = listaSorteados.querySelectorAll('.recente')
        for (var i = 0; i < anteriores.length; i++) anteriores[i].classList.remove('recente')
        listaSorteados.appendChild(criarBadge(historico.length, num, true))
        listaSorteados.scrollLeft = listaSorteados.scrollWidth
        atualizarHud()
      }

      function atualizarHud() {
        hud.hidden = historico.length === 0 && !sequenciaAtiva
        hud.classList.toggle('completo', ultimaSequenciaCompleta || (rodaAtiva() && historico.length > 0 && restantesNaRoda().length === 0))
        btnLimpar.disabled = sequenciaAtiva || girando || historico.length === 0
        btnCopiar.disabled = historico.length === 0
      }

      function limparHistorico() {
        historico = []
        ultimaSequenciaCompleta = false
        renderizarHistorico()
        aplicarForaDaRoda()
        document.title = TITULO_BASE
      }

      function copiarOrdem() {
        if (!historico.length) return
        var partes = []
        for (var i = 0; i < historico.length; i++) partes.push((i + 1) + 'º ' + rotulo(historico[i]))
        var texto = 'Ordem do sorteio: ' + partes.join(', ')
        var ok = function () { mostrarToast('Ordem copiada') }
        var falhou = function () { mostrarToast('Não foi possível copiar') }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(texto).then(ok, function () { copiarFallback(texto) ? ok() : falhou() })
        } else {
          copiarFallback(texto) ? ok() : falhou()
        }
      }

      function copiarFallback(texto) {
        try {
          var ta = document.createElement('textarea')
          ta.value = texto
          ta.setAttribute('readonly', '')
          ta.style.position = 'fixed'
          ta.style.opacity = '0'
          document.body.appendChild(ta)
          ta.select()
          var ok = document.execCommand('copy')
          document.body.removeChild(ta)
          return ok
        } catch (e) {
          return false
        }
      }

      // ---------- Toast ----------
      var toastTimer = null
      function mostrarToast(texto, acaoTexto, acao, duracaoMs) {
        toastTexto.textContent = texto
        if (acaoTexto && acao) {
          toastAcao.textContent = acaoTexto
          toastAcao.hidden = false
          toastAcao.onclick = function () {
            esconderToast()
            acao()
          }
        } else {
          toastAcao.hidden = true
          toastAcao.onclick = null
        }
        toast.hidden = false
        if (toastTimer) window.clearTimeout(toastTimer)
        toastTimer = window.setTimeout(esconderToast, duracaoMs || 2600)
      }

      function esconderToast() {
        if (toastTimer) window.clearTimeout(toastTimer)
        toastTimer = null
        toast.hidden = true
      }

      // ---------- Tela cheia ----------
      var raiz = document.documentElement
      // Só em telas com mouse/trackpad (desktop/notebook): no celular/tablet não faz sentido
      var telaDeToque = !!(window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches)
      var suportaTelaCheia = !telaDeToque && !!((raiz.requestFullscreen || raiz.webkitRequestFullscreen) && (document.fullscreenEnabled || document.webkitFullscreenEnabled))
      function emTelaCheia() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement)
      }

      function alternarTelaCheia() {
        if (!suportaTelaCheia) return
        try {
          if (emTelaCheia()) {
            (document.exitFullscreen || document.webkitExitFullscreen).call(document)
          } else {
            var r = (raiz.requestFullscreen || raiz.webkitRequestFullscreen).call(raiz)
            if (r && r.catch) r.catch(function () {})
          }
        } catch (e) {}
      }

      function atualizarBotaoTelaCheia() {
        var on = emTelaCheia()
        btnTelaCheia.setAttribute('aria-pressed', String(on))
        btnTelaCheia.title = (on ? 'Sair da tela cheia' : 'Tela cheia') + ' (F)'
        btnTelaCheia.setAttribute('aria-label', on ? 'Sair da tela cheia' : 'Tela cheia')
      }

      // ---------- Giro "um por vez" ----------
      var tempoInicioSegurar = 0
      var forcaAtual = 0
      var velAtual = VEL_BASE

      function forcaDe(ms) {
        return Math.min(1, Math.max(0, ms / 1200))
      }

      function vencedorForcado() {
        return rodaAtiva() ? sortearEntre(restantesNaRoda()) : undefined
      }

      function podeGirarUnico() {
        return cfg.modo === 'unico' && emRepouso() && !(rodaAtiva() && restantesNaRoda().length === 0)
      }

      function aoTerminarGiroUnico(num) {
        adicionarHistorico(num)
        mostrarResultado(num, 'Sorteado')
        if (rodaAtiva() && restantesNaRoda().length === 0) {
          mostrarToast('Todos foram sorteados', 'Recomeçar', recomecarRoda, 5000)
        }
        atualizarTudo()
      }

      function prepararGiro() {
        aplicarForaDaRoda()
        atualizarTudo()
      }

      function iniciarSegurar() {
        if (!podeGirarUnico()) return
        liberarAudioIOS()
        pararAnimacaoAtual()
        prepararGiro()
        segurando = true
        tempoInicioSegurar = performance.now()
        forcaAtual = 0
        tocarMusica()
        atualizarTudo()
        var ultimo = tempoInicioSegurar
        function loopGiro(agora) {
          if (!segurando) return
          var dt = Math.max(0, agora - ultimo) / 1000
          ultimo = agora
          forcaAtual = forcaDe(agora - tempoInicioSegurar)
          velAtual = VEL_BASE * (0.55 + 0.45 * forcaAtual)
          aplicarRotacao(anguloAcumulado - velAtual * dt)
          animFrameId = requestAnimationFrame(loopGiro)
        }
        animFrameId = requestAnimationFrame(loopGiro)
      }

      function finalizarSegurar() {
        if (!segurando) return
        segurando = false
        forcaAtual = forcaDe(performance.now() - tempoInicioSegurar)
        var omega = VEL_BASE * (0.55 + 0.45 * forcaAtual)
        executarDesaceleracaoFisica(cfg.faces, omega, duracaoGiro(forcaAtual), aoTerminarGiroUnico, vencedorForcado())
        atualizarTudo()
      }

      function girarUmaVez() {
        if (!podeGirarUnico()) return
        prepararGiro()
        tocarMusica()
        executarDesaceleracaoFisica(cfg.faces, VEL_BASE * 0.8, duracaoGiro(0.5), aoTerminarGiroUnico, vencedorForcado())
        atualizarTudo()
      }

      function recomecarRoda() {
        if (!emRepouso()) return
        limparHistorico()
        atualizarTudo()
        mostrarToast('Roda recomeçada')
      }

      // ---------- Sequência ----------
      function iniciarSequencia(primeiroGiro) {
        if (!emRepouso()) return
        var total = cfg.faces
        var n = cfg.faces
        var meuId = ++idSequencia
        sequenciaAtiva = true
        ultimaSequenciaCompleta = false
        esconderToast()
        tocarMusica()
        historico = []
        renderizarHistorico()
        atualizarTudo()
        var tempoPausa = reduzirMovimento ? 900 : 1400
        function proximo() {
          if (meuId !== idSequencia || !sequenciaAtiva) return
          if (historico.length >= total) {
            encerrarSequencia(true)
            return
          }
          var disponiveis = []
          for (var c = 1; c <= n; c++) if (historico.indexOf(c) === -1) disponiveis.push(c)
          if (!disponiveis.length) {
            encerrarSequencia(true)
            return
          }
          var forcedNum = sortearEntre(disponiveis)
          continuarMusica()
          var omegaGiro = VEL_BASE, tempoGiro = duracaoGiro(0.5)
          if (primeiroGiro) {
            omegaGiro = primeiroGiro.omega
            tempoGiro = primeiroGiro.tempo
            arrasteSentidoPositivo = primeiroGiro.omega > 0
            primeiroGiro = null
          }
          executarDesaceleracaoFisica(n, omegaGiro, tempoGiro, function (num) {
            if (!sequenciaAtiva || meuId !== idSequencia) return
            adicionarHistorico(num)
            mostrarResultado(num, historico.length + 'º sorteado')
            atualizarTudo()
            window.setTimeout(function () {
              if (sequenciaAtiva && meuId === idSequencia) proximo()
            }, tempoPausa)
          }, forcedNum)
          atualizarTudo()
        }
        proximo()
      }

      function encerrarSequencia(completa) {
        idSequencia++
        var estavaAtiva = sequenciaAtiva
        sequenciaAtiva = false
        pararMusica()
        pararAnimacaoAtual()
        girando = false
        ultimaSequenciaCompleta = !!completa
        if (estavaAtiva) {
          if (completa) mostrarToast('Sequência completa')
          else mostrarToast('Sequência interrompida')
        }
        atualizarTudo()
      }

      // ---------- Girar o pião com o dedo / mouse ----------
      // O pião é um cilindro em torno do eixo vertical: arrastar na horizontal gira o "rolo".
      // A face acompanha o dedo; ao soltar, a velocidade dos últimos ~100 ms (como o
      // VelocityTracker do Android) vira a velocidade inicial e define o tempo de giro.
      var areaGiro = $('#area-giro')
      var JANELA_VELOCIDADE_MS = 100
      var VEL_MIN_SORTEIO = 400   // graus/s: abaixo disso não sorteia, só realinha
      var VEL_MAX = 3000          // graus/s
      var TEMPO_MIN = 1.5, TEMPO_MAX = 6 // segundos
      var arraste = null

      function grausPorPixel() {
        var escala = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--escala')) || 1
        return 180 / (Math.PI * RAIO_CILINDRO * escala)
      }

      // Velocidade no instante final por mínimos quadrados de 2ª ordem (a + b·t + c·t²; v = b)
      function velocidadeFinal(amostras) {
        if (amostras.length < 2) return 0
        var tf = amostras[amostras.length - 1].t
        if (amostras.length === 2) {
          var dt = (tf - amostras[0].t) / 1000
          return dt > 0 ? (amostras[1].a - amostras[0].a) / dt : 0
        }
        var S0 = 0, S1 = 0, S2 = 0, S3 = 0, S4 = 0, Y0 = 0, Y1 = 0, Y2 = 0
        for (var i = 0; i < amostras.length; i++) {
          var t = (amostras[i].t - tf) / 1000
          var y = amostras[i].a
          var t2 = t * t
          S0 += 1; S1 += t; S2 += t2; S3 += t2 * t; S4 += t2 * t2
          Y0 += y; Y1 += y * t; Y2 += y * t2
        }
        // Resolve [S0 S1 S2; S1 S2 S3; S2 S3 S4]·[a b c] = [Y0 Y1 Y2] (regra de Cramer para b)
        var det = S0 * (S2 * S4 - S3 * S3) - S1 * (S1 * S4 - S3 * S2) + S2 * (S1 * S3 - S2 * S2)
        if (Math.abs(det) < 1e-12) {
          var dt2 = (tf - amostras[0].t) / 1000
          return dt2 > 0 ? (amostras[amostras.length - 1].a - amostras[0].a) / dt2 : 0
        }
        var detB = S0 * (Y1 * S4 - S3 * Y2) - Y0 * (S1 * S4 - S3 * S2) + S2 * (S1 * Y2 - Y1 * S2)
        return detB / det
      }

      function tempoPelaVelocidade(v) {
        if (reduzirMovimento) return 1.2
        var f = (v - VEL_MIN_SORTEIO) / (VEL_MAX - VEL_MIN_SORTEIO)
        return TEMPO_MIN + Math.min(1, Math.max(0, f)) * (TEMPO_MAX - TEMPO_MIN)
      }

      function podeArrastar() {
        if (!emRepouso()) return false
        if (cfg.modo === 'unico') return !(rodaAtiva() && restantesNaRoda().length === 0)
        return true
      }

      function alinharFaceMaisProxima() {
        var passo = 360 / cfg.faces
        var inicio = anguloAcumulado
        var alvo = Math.round(inicio / passo) * passo
        if (Math.abs(alvo - inicio) < 0.01) return
        var t0 = performance.now(), dur = 260
        pararAnimacaoAtual()
        function frame(agora) {
          var u = Math.min(1, (agora - t0) / dur)
          aplicarRotacao(inicio + (alvo - inicio) * (1 - Math.pow(1 - u, 3)))
          if (u < 1) animFrameId = requestAnimationFrame(frame)
          else animFrameId = null
        }
        animFrameId = requestAnimationFrame(frame)
      }

      areaGiro.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return
        if (!podeArrastar()) return
        e.preventDefault()
        liberarAudioIOS()
        pararAnimacaoAtual()
        try { areaGiro.setPointerCapture(e.pointerId) } catch (err) {}
        var agora = performance.now()
        arraste = { id: e.pointerId, x0: e.clientX, a0: anguloAcumulado, k: grausPorPixel(), amostras: [{ t: agora, a: anguloAcumulado }] }
        arrastando = true
        areaGiro.classList.add('arrastando')
        atualizarTudo()
      })

      areaGiro.addEventListener('pointermove', function (e) {
        if (!arraste || e.pointerId !== arraste.id) return
        var agora = performance.now()
        var a = arraste.a0 + (e.clientX - arraste.x0) * arraste.k
        aplicarRotacao(a)
        arraste.amostras.push({ t: agora, a: a })
        while (arraste.amostras.length > 2 && agora - arraste.amostras[0].t > JANELA_VELOCIDADE_MS) arraste.amostras.shift()
      })

      function soltarArraste(e, cancelado) {
        if (!arraste || (e && e.pointerId !== arraste.id)) return
        var agora = performance.now()
        var recentes = arraste.amostras.filter(function (s) { return agora - s.t <= JANELA_VELOCIDADE_MS })
        var v = cancelado ? 0 : velocidadeFinal(recentes)
        arraste = null
        arrastando = false
        areaGiro.classList.remove('arrastando')
        var modulo = Math.min(VEL_MAX, Math.abs(v))
        if (modulo < VEL_MIN_SORTEIO) {
          alinharFaceMaisProxima()
          atualizarTudo()
          return
        }
        var omega = (v < 0 ? -1 : 1) * modulo
        var tempo = tempoPelaVelocidade(modulo)
        if (cfg.modo === 'unico') {
          prepararGiro()
          tocarMusica()
          arrasteSentidoPositivo = omega > 0
          executarDesaceleracaoFisica(cfg.faces, omega, tempo, aoTerminarGiroUnico, vencedorForcado())
          atualizarTudo()
        } else {
          iniciarSequencia({ omega: omega, tempo: tempo })
        }
      }

      areaGiro.addEventListener('pointerup', function (e) { soltarArraste(e, false) })
      areaGiro.addEventListener('pointercancel', function (e) { soltarArraste(e, true) })
      areaGiro.addEventListener('lostpointercapture', function (e) { soltarArraste(e, false) })
      areaGiro.addEventListener('contextmenu', function (e) { e.preventDefault() })

      // ---------- Ação: dois toques no pião (ou Enter/Espaço) ----------
      function dispararAcao() {
        liberarAudioIOS()
        if (sequenciaAtiva) {
          encerrarSequencia(false)
          return
        }
        if (!emRepouso()) return
        if (cfg.modo !== 'unico') {
          iniciarSequencia()
        } else if (rodaAtiva() && restantesNaRoda().length === 0) {
          recomecarRoda()
        } else {
          girarUmaVez()
        }
      }

      // Registrado depois do arraste: num toque, o arraste termina (sem sortear) antes daqui
      var DOIS_TOQUES_MS = 350
      var toqueInicio = null
      var ultimoToque = null
      areaGiro.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return
        toqueInicio = { x: e.clientX, y: e.clientY, t: performance.now() }
      })
      areaGiro.addEventListener('pointerup', function (e) {
        if (!toqueInicio) return
        var agora = performance.now()
        var foiToque = Math.abs(e.clientX - toqueInicio.x) < 10 && Math.abs(e.clientY - toqueInicio.y) < 10 && agora - toqueInicio.t < 350
        toqueInicio = null
        if (!foiToque) {
          ultimoToque = null
          return
        }
        if (ultimoToque && agora - ultimoToque.t < DOIS_TOQUES_MS && Math.abs(e.clientX - ultimoToque.x) < 40 && Math.abs(e.clientY - ultimoToque.y) < 40) {
          ultimoToque = null
          dispararAcao()
        } else {
          ultimoToque = { x: e.clientX, y: e.clientY, t: agora }
        }
      })
      areaGiro.addEventListener('dblclick', function (e) { e.preventDefault() })

      // ---------- Teclado ----------
      window.addEventListener('keydown', function (e) {
        if (e.ctrlKey || e.metaKey || e.altKey) return
        var alvo = e.target
        var emOutroControle = alvo && alvo.tagName === 'BUTTON'
        if (e.code === 'Space' || e.key === ' ') {
          if (emOutroControle) return
          e.preventDefault()
          if (e.repeat) return
          if (cfg.modo === 'unico' && !sequenciaAtiva) {
            if (podeGirarUnico()) iniciarSegurar()
            else if (emRepouso()) dispararAcao()
          } else {
            dispararAcao()
          }
          return
        }
        if (e.key === 'Enter') {
          if (emOutroControle) return
          e.preventDefault()
          dispararAcao()
          return
        }
        if (e.key === 'Escape') {
          if (sequenciaAtiva) encerrarSequencia(false)
          return
        }
        var k = (e.key || '').toLowerCase()
        if (k === 's') { liberarAudioIOS(); definirSom(!cfg.som) }
        else if (k === 'f') alternarTelaCheia()
      })

      // Se a janela perde o foco com o Espaço segurado, o keyup nunca chega: solta o giro
      window.addEventListener('blur', function () {
        if (segurando) finalizarSegurar()
      })

      window.addEventListener('keyup', function (e) {
        if (e.code !== 'Space' && e.key !== ' ') return
        if (segurando) {
          e.preventDefault()
          finalizarSegurar()
        }
      })

      // ---------- Ícones ----------
      // Clique de mouse não deixa o foco no ícone: Espaço/Enter continuam girando o pião
      document.querySelectorAll('.icone, .hud-acoes button').forEach(function (el) {
        el.addEventListener('mousedown', function (e) { e.preventDefault() })
      })
      btnMenosFaces.addEventListener('click', function () { definirFaces(cfg.faces - 1) })
      btnMaisFaces.addEventListener('click', function () { definirFaces(cfg.faces + 1) })
      btnRotulos.addEventListener('click', alternarRotulos)
      btnRoda.addEventListener('click', alternarRoda)
      btnTodos.addEventListener('click', alternarModo)
      btnSom.addEventListener('click', function () { liberarAudioIOS(); definirSom(!cfg.som) })
      if (suportaTelaCheia) {
        btnTelaCheia.addEventListener('click', alternarTelaCheia)
        document.addEventListener('fullscreenchange', atualizarBotaoTelaCheia)
        document.addEventListener('webkitfullscreenchange', atualizarBotaoTelaCheia)
      } else {
        btnTelaCheia.hidden = true
      }
      btnCopiar.addEventListener('click', copiarOrdem)
      btnLimpar.addEventListener('click', function () {
        if (!historico.length || !emRepouso()) return
        var backup = historico.slice()
        var backupCompleta = ultimaSequenciaCompleta
        limparHistorico()
        atualizarTudo()
        mostrarToast('Sorteados limpos', 'Desfazer', function () {
          if (!emRepouso()) return
          historico = backup
          ultimaSequenciaCompleta = backupCompleta
          renderizarHistorico()
          aplicarForaDaRoda()
          atualizarTudo()
        }, 5000)
      })

      // Gestos que destravam o AudioContext (o iOS aceita touchend/mousedown/keydown; não touchstart)
      ;['pointerdown', 'mousedown', 'touchend', 'pointerup', 'click', 'keydown'].forEach(function (tipo) {
        document.addEventListener(tipo, liberarAudioIOS, { capture: true, passive: true })
      })
      document.addEventListener('visibilitychange', function () {
        if (!ctxAudio) return
        if (document.hidden) {
          pararMusica()
          ctxAudio.suspend().catch(function () {})
        }
      })

      // ---------- Escala do palco (inalterado) ----------
      var palco = document.getElementById('palco')
      var STAGE_TOTAL = 490
      var supportsZoom = (function () {
        try {
          return typeof CSS !== 'undefined' && CSS.supports && CSS.supports('zoom', '1')
        } catch (e) {
          return false
        }
      })()

      function ajustarEscalaPalco() {
        if (!palco) return
        var vv = window.visualViewport
        var viewW = vv && vv.width ? vv.width : window.innerWidth
        var viewH = vv && vv.height ? vv.height : window.innerHeight
        var ctaReserve = 82
        try {
          var raw = window.getComputedStyle(palco).getPropertyValue('--cta-reserve')
          if (raw) {
            var probe = document.createElement('div')
            probe.style.cssText = 'position:absolute;visibility:hidden;height:' + raw
            document.body.appendChild(probe)
            var resolved = probe.offsetHeight
            document.body.removeChild(probe)
            if (resolved > 0) ctaReserve = resolved
          }
        } catch (err) {}
        var availW = Math.max(200, viewW - 16)
        var availH = Math.max(200, viewH - ctaReserve - RESERVA_TOPO - 8)
        var scale = Math.min(1, availW / STAGE_TOTAL, availH / STAGE_TOTAL)
        scale = Math.max(0.42, Math.round(scale * 1000) / 1000)
        if (supportsZoom) {
          palco.style.zoom = String(scale)
          palco.style.transform = ''
          palco.style.webkitTransform = ''
        } else {
          palco.style.zoom = ''
          palco.style.transform = 'scale(' + scale + ')'
          palco.style.webkitTransform = 'scale(' + scale + ')'
        }
        palco.style.transformOrigin = 'center center'
        palco.style.webkitTransformOrigin = 'center center'
        palco.setAttribute('data-scale', String(scale))
        centralizarFundo()
      }

      // Sombra e raios do fundo acompanham o centro e a escala reais da moldura
      var wrapperPiao = document.getElementById('wrapper')
      function centralizarFundo() {
        if (!wrapperPiao) return
        var r = wrapperPiao.getBoundingClientRect()
        if (!r.width) return
        var raiz = document.documentElement.style
        raiz.setProperty('--centro-x', (r.left + r.width / 2).toFixed(1) + 'px')
        raiz.setProperty('--centro-y', (r.top + r.height / 2).toFixed(1) + 'px')
        raiz.setProperty('--escala', (r.width / 400).toFixed(3))
      }

      var resizeTimer = null
      function agendarAjusteEscala() {
        if (resizeTimer) window.clearTimeout(resizeTimer)
        resizeTimer = window.setTimeout(ajustarEscalaPalco, 50)
      }
      window.addEventListener('resize', agendarAjusteEscala)
      window.addEventListener('orientationchange', function () {
        window.setTimeout(ajustarEscalaPalco, 120)
      })
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', agendarAjusteEscala)
        window.visualViewport.addEventListener('scroll', agendarAjusteEscala)
      }

      // ---------- Início ----------
      criarContextoAudio() // nasce suspenso; já baixa e decodifica a trilha
      construirPiao(cfg.faces)
      definirSom(cfg.som)
      atualizarBotaoTelaCheia()
      atualizarTudo()
      ajustarEscalaPalco()
      mostrarToast(telaDeToque ? 'Toque duas vezes no pião ou arraste para girar' : 'Clique duas vezes no pião ou arraste para girar', null, null, 4000)
    })()
  </script>
</body>
</html>
